name: setup-symex-msvc
description: >
  The symex-msvc toolchain (RFC-0016 CI-B): the patched Nim OCI artifact, Z3
  4.13.4 (x64-win, hash-pinned), the hash-pinned pcre64.dll for std/re, the
  milpa.lock deps at their provenance SHAs, and the MSVC developer environment
  (cl.exe on PATH) imported from the runner's Visual Studio. The steps are the
  fuzzer-msvc.yaml and symex-mingw.yaml ones, shared here so the nightly leg
  does not carry a third copy.
runs:
  using: composite
  steps:
    - name: Install Z3 4.13.4 (x64-win)
      uses: ./.github/actions/setup-z3-windows

    - name: Install pcre64.dll for std/re
      shell: pwsh
      run: |
        $zipSha = '4b20b0fc775d2cfece0c1a09d4ec0bdbcd01d257ce8d556d9a8a88e6c4cd6961'
        $dllSha = 'adfe6ba22e66b14af30d368cd1458547f86ba81825bcfae1d3a1b4cb6068b2bb'
        curl.exe -L -o C:\nimdlls.zip 'https://nim-lang.org/download/dlls.zip'
        if ($LASTEXITCODE -ne 0) { throw 'dlls.zip download failed' }
        $got = (Get-FileHash C:\nimdlls.zip -Algorithm SHA256).Hash.ToLower()
        if ($got -ne $zipSha) { throw "dlls.zip sha256 mismatch: $got" }
        Expand-Archive -Path C:\nimdlls.zip -DestinationPath C:\nimdlls-all -Force
        New-Item -ItemType Directory -Force C:\pcre | Out-Null
        Copy-Item C:\nimdlls-all\pcre64.dll C:\pcre\pcre64.dll
        $got = (Get-FileHash C:\pcre\pcre64.dll -Algorithm SHA256).Hash.ToLower()
        if ($got -ne $dllSha) { throw "pcre64.dll sha256 mismatch: $got" }
        Add-Content $env:GITHUB_PATH 'C:\pcre'

    - name: Clone deps at milpa.lock provenance SHAs
      shell: pwsh
      run: |
        $lock = Get-Content milpa.lock -Raw
        New-Item -ItemType Directory -Force _deps | Out-Null
        $pattern = 'dep "(?<name>[^"]+)" \{[\s\S]*?provenance \{[\s\S]*?url "(?<url>[^"]+)"[\s\S]*?commit_sha "(?<sha>[0-9a-f]{40})"'
        foreach ($m in [regex]::Matches($lock, $pattern)) {
          $name = $m.Groups['name'].Value
          $url  = $m.Groups['url'].Value
          $sha  = $m.Groups['sha'].Value
          Write-Host "dep $name -> $url @ $sha"
          git clone $url "_deps/$name"
          git -C "_deps/$name" checkout --detach $sha
          if ($LASTEXITCODE -ne 0) { throw "checkout failed for $name" }
        }
        if (!(Test-Path _deps/z3) -or !(Test-Path _deps/softlink)) {
          throw 'expected deps z3 + softlink not resolved from milpa.lock'
        }

    - name: Import the MSVC developer environment (puts cl.exe on PATH)
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found -- no Visual Studio on this runner' }
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw 'vswhere found no installation carrying the VC++ x64 toolset' }
        $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
        if (-not (Test-Path $vcvars)) { throw "vcvars64.bat missing at $vcvars" }
        cmd /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
          if ($_ -match '^([^=]+)=(.*)$') {
            "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
        }
        Write-Host "imported MSVC env from $vs"

    - name: Install the patched Nim toolchain (OCI artifact, no container)
      uses: ./.github/actions/setup-nim-artifact
      with:
        tag: 2.2.10-windows-x64

    - name: Report toolchain versions
      shell: pwsh
      run: |
        $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
        if (-not $cl) { throw 'cl.exe not on PATH after importing vcvars64' }
        Write-Host "cl.exe: $($cl.Source)"
        nim --version
        $prev = $ErrorActionPreference; $ErrorActionPreference = 'Continue'
        & cmd /c "cl.exe 2>&1" | Select-Object -First 2 | ForEach-Object { Write-Host $_ }
        $ErrorActionPreference = $prev
