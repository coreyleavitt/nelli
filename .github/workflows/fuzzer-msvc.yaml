name: fuzzer-msvc

# MSVC (cl.exe) CI leg for the fuzzer + db suite.
#
# WHY THIS EXISTS: `fuzzer-mingw.yaml` proves the suite RUNS on Windows,
# but it builds with `setup-nim-action`'s stock Nim and whatever `--cc`
# that action defaults to (mingw/gcc) -- it never exercises MSVC. Two gaps
# that leg cannot close:
#   1. cl.exe compatibility. `src/nelli/nelli_shm.c` is `{.compile.}`d
#      straight into the Nim binary (coverage.nim's `when defined(posix) or
#      defined(windows): {.compile: "nelli_shm.c".}`), so `--cc:vcc` routes
#      it through cl.exe, which has never compiled it before this leg
#      existed. `src/nelli/nelli_cov.c` (the vendorable external-target
#      runtime) also needs an MSVC-buildable constructor path for an
#      MSVC-built consumer, even though it is normally compiled by the
#      EXTERNAL target's own compiler, not by this repo's build.
#   2. Nim-patch parity. `setup-nim-action`'s Nim is NOT necessarily the
#      same patch series as `ghcr.io/coreyleavitt/nim:latest` (Nim 2.2.10
#      carrying backports #25855/#25858/#26093/#26017/#26110 -- see
#      scripts/Containerfile and docs/rfc/0003-fuzzer-nextgen.windows-capability.md).
#      This leg uses that EXACT image's windows/amd64 manifest entry (Nim
#      2.2.10 on `mcr.microsoft.com/windows/servercore:ltsc2025`, WITH
#      MSVC), so it is patch-parity with the Linux dev image on top of
#      being an MSVC build, closing both gaps in one leg.
#
# WHY A SEPARATE FILE, not a matrix leg on fuzzer-mingw.yaml: the two legs
# differ in compiler (cl.exe vs mingw gcc) and in what they are allowed to
# assume about the environment (this one has no gcc, hence
# NELLI_NO_COV_BACKEND). They share the deps-clone and Z3-download steps
# verbatim; contorting both into one matrix would obscure more than it shares.
#
# NO CONTAINER (changed 2026-09-02). This leg used to `docker run` a Windows
# container purely to obtain the patched Nim, which required the Docker daemon
# on a Windows runner -- not reliably running, and the source of a
# "start the service and wait up to 3 minutes for the named pipe to answer"
# preamble added after runs failed with `npipe:////./pipe/docker_engine ...
# cannot find the file specified`. The same toolchain is now published as an
# OCI *artifact* (`ghcr.io/coreyleavitt/nim:2.2.10-windows-x64`,
# artifactType `application/x-nim-toolchain`), so it is simply downloaded and
# unpacked by `.github/actions/setup-nim-artifact`. Same build, same patches,
# different delivery -- patch parity is preserved exactly, and the whole
# Windows-container failure class is gone. MSVC comes from the runner's own
# Visual Studio via vcvars64, imported into the job env.
#
# `windows-2025` (not `windows-latest`): the pin originally existed because
# Windows process isolation requires the container's base build to match the
# HOST build. There is no container now, so the pin is only about keeping the
# toolchain image stable rather than floating with whatever `windows-latest`
# means this month. It can be relaxed if that ever costs anything.
#
# Z3: downloaded to `C:\z3` on the runner (identical step to the other two
# Windows legs, keeping the 4.13.4 pin in one place). Both halves are covered
# without any mount plumbing now -- `--cincludes:C:\z3\include` for the
# compile, and `C:\z3\bin` on `$env:GITHUB_PATH` for the dlopen'd
# `libz3.dll` at run time, which a container would not have inherited.
#
# Deps are cloned at the EXACT commit SHAs recorded in milpa.lock, into
# `_deps` -- same discipline, same regex, as the other two Windows legs.
#
# SHARDING (2026-11-09). The leg was one serial job: the fuzzer + db suite
# (~37 min) followed by every tsymex_0016_* walker test (~50 s each, 89 and
# growing), which hit the 90-minute timeout on every main push. It is now a
# matrix:
#   suites       the fuzzer + db suite and the named contract tests
#   shards       Linux job; derives the walker-test list and partitions it
#                (scripts/shard-walker-tests.py: sorted by file name, test i
#                to shard i % N) and FAILS if the union of the shards is not
#                exactly the glob, so a test can be neither dropped nor run
#                twice
#   walker       one job per shard, each running only its own tests
#   fuzzer-msvc  the join: needs everything above and keeps the leg's old
#                job name, so anything keyed on that check name still works
# To change the shard count, edit WALKER_SHARDS in the `shards` job. Pick it so
# a shard stays near 20-25 min (tests x ~50 s / N), well under its 60-minute
# timeout. Setup per job is cheap: the Z3 prefix and the deps clones are
# restored from actions/cache (.github/actions/setup-msvc-leg), and the Nim
# artifact is a ~22MB digest-verified download.

on:
  push:
    # Pattern, not a hand-maintained list: a named allowlist silently gives a
    # new RFC branch ZERO Windows verification until someone remembers to edit
    # this line (it drifted once already -- rfc-fuzzer-nextgen and
    # rfc-z3-optional were both long merged while still listed here).
    branches: [main, 'rfc-*']
    # Prose-only pushes must not burn a Windows runner. Verified safe: nothing
    # under docs/ is read by the build or the suite -- the workflows and tests
    # only ever cite these paths in comments and error strings, never
    # staticRead them. Listed explicitly rather than as `**.md`, because the
    # audit suites DO staticRead files under src/ and tests/, and a blanket
    # markdown glob would be one stray .md away from skipping a real change.
    # If ALL files in a push match, the leg is skipped; a mixed push runs.
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'LICENSE'
  # RFC-0016 W1-m: re-run the walker leg against any ref on demand (a release
  # candidate before a tag, or a throwaway ref). Inputs from a branch dispatch
  # only work once the default branch's copy of this file declares them too.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to check out (empty = the triggering ref)'
        required: false
        default: ''
      tests_glob:
        description: 'Walker test glob for the vcc step'
        required: false
        default: 'tests/tsymex_0016_*.nim'
      nim_flags:
        description: 'Extra nim flags for the vcc step (e.g. --debugger:native -d:nelliReplayReexec)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/rfc-') }}


env:
  WALKER_SHARDS: "4"

jobs:
  suites:
    name: suites (fuzzer + db)
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          # Empty on push (the triggering ref); the dispatch input otherwise.
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-msvc-leg
      - name: Write the MSVC test-runner script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _ci | Out-Null
          @'
          $ErrorActionPreference = "Stop"

          Write-Host "=== environment diagnostics ==="
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          nim --version
          Write-Host "--- cl.exe ---"
          $clPath = (Get-Command cl.exe -ErrorAction SilentlyContinue)
          if ($clPath) {
            Write-Host "cl.exe found at: $($clPath.Source)"
            # Banner probe via cmd, with ErrorActionPreference relaxed for the
            # duration: bare `cl.exe` writes its version banner to STDERR and
            # exits nonzero, and PowerShell under `Stop` turns a native
            # command's `2>&1`-redirected stderr into a TERMINATING error --
            # which failed this leg's first run on the diagnostic line itself,
            # before a single test compiled. Routing through `cmd /c` keeps the
            # redirection on the cmd side, where PowerShell never sees stderr
            # records at all.
            $prevEap = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            & cmd /c "cl.exe 2>&1" | Select-Object -First 3 | ForEach-Object { Write-Host $_ }
            $ErrorActionPreference = $prevEap
          } else {
            Write-Host "cl.exe NOT FOUND ON PATH -- --cc:vcc will fail to locate the compiler"
          }
          Write-Host "PATH=$env:PATH"
          Write-Host "INCLUDE=$env:INCLUDE"
          Write-Host "LIB=$env:LIB"
          Write-Host "--- Z3 (mounted at C:\z3) ---"
          if (Test-Path C:\z3\bin\libz3.dll) { Write-Host "C:\z3\bin\libz3.dll: present" } else { Write-Host "C:\z3\bin\libz3.dll: MISSING" }
          if (Test-Path C:\z3\include\z3.h)  { Write-Host "C:\z3\include\z3.h: present" }  else { Write-Host "C:\z3\include\z3.h: MISSING" }

          # The container process does not inherit the runner shell's
          # $env:GITHUB_PATH addition -- it must be set here, inside the
          # container, so the dlopen'd libz3.dll resolves at test-run time.
          $env:PATH = "C:\z3\bin;$env:PATH"

          # RFC-z3-optional: the Z3-free import probe. Keep this step
          # identical to fuzzer-mingw.yaml's (these two legs are
          # hand-synced twins; see the note at the discovery pattern below).
          # A compile-only probe is not mingw-specific -- the property it
          # guards is "nothing under src/ transitively imports z3", which is
          # a Nim-level fact both toolchains must satisfy, so it runs on
          # both rather than being asserted once and assumed.
          #
          # All four skips are load-bearing: --skipProjCfg/--skipParentCfg
          # alone still leave the user config and ~/.nimble/pkgs2 able to
          # resolve `import z3`, so on a machine with a nimble-installed z3
          # this check would go silently green even after a regression. No
          # --path for z3 or softlink, deliberately: an accidental direct
          # softlink import must fail here too.
          Write-Host "==> z3-free import probe (tz3free_probe.nim)"
          nim c --cc:vcc --hints:off --colors:off `
            --nimcache:_nimcache-probe `
            --skipProjCfg --skipParentCfg --skipUserCfg --noNimblePath `
            --path:src "tests\tz3free_probe.nim"
          if ($LASTEXITCODE -ne 0) {
            throw "z3-free probe FAILED: import nelli no longer compiles without z3 on the path. Something under src/ reintroduced a transitive 'import z3' -- see docs/rfc/0004-z3-optional.md."
          }
          Write-Host "z3-free probe OK (compiled with no z3 path)"

          # Suite-discovery pattern (canonical comment -- fuzzer-mingw.yaml
          # points back here): prefix match on tfuzz*/tdb* (the fuzzer and
          # db-persistence suites) plus tengine_* (forAll/fuzz front-door
          # integration tests -- RFC-fuzzer-nextgen U0/U2 -- named
          # tengine_<topic> because they live in the `forAll` front door, not
          # the `fuzz` one, so they don't get a tfuzz* name) plus three EXACT
          # basenames: tlearnedstate (S6 checkpoint-blob suite -- branch-
          # specific but fits neither prefix), tcoverage and tcovguided (the
          # coverage-runtime and coverage-as-PBT-target suites that exercise
          # this branch's rewrite of src/nelli/coverage.nim).
          #
          # Deliberately NOT swept in by a broader "tcov*" or bare "tengine"
          # match, checked against the full tests/ directory before this
          # pattern was chosen:
          #   - tengine.nim: the core forAll/property-runner suite. It
          #     predates this branch, is untouched by it, and is not
          #     fuzzer-specific -- out of scope for this leg.
          #   - tcoveragemode.nim, tcovsourcetable.nim: also predate this
          #     branch and are untouched by it (only tcoverage.nim and
          #     tcovguided.nim were touched, each by a handful of lines). A
          #     "tcov*" prefix would have swept both of these in incidentally;
          #     naming the two in-scope files explicitly instead keeps this
          #     leg scoped to what the branch actually changed instead of
          #     silently growing to "every test that happens to share a
          #     prefix with a coverage suite".
          #   - tconfigdefaults.nim: RFC-0010's definition of done. Named
          #     explicitly for the same reason tlearnedstate was -- it fits
          #     neither prefix. It belongs on a fuzzer leg despite testing
          #     `Settings` rather than `fuzz`, because RFC-0010 gives
          #     IntegerBiasConfig declared defaults and FuzzSettings embeds
          #     it, so the flip reaches this leg's surface; and because these
          #     are the only Windows legs a core suite can reach at all
          #     (symex-mingw takes tsymex_* names only).
          # New tfuzz*/tdb*/tengine_* files are still picked up automatically
          # by the prefix arms -- only a new file outside those prefixes (like
          # tlearnedstate.nim was) needs this leg's pattern touched.
          $tests = Get-ChildItem tests -Filter "t*.nim" |
            Where-Object {
              $_.BaseName -match "^(tfuzz|tdb|tengine_)" -or
              $_.BaseName -match "^(tlearnedstate|tcoverage|tcovguided|tconfigdefaults|tentrypointwiring)$"
            } |
            Sort-Object Name
          Write-Host "discovered $($tests.Count) test files"
          if ($tests.Count -eq 0) {
            throw "discovered 0 test files under tests\ -- the discovery pattern is broken; refusing to report a false green"
          }
          # RFC-z3-optional S2: half (2) of the load-bearing property --
          # "adding `import nelli/concolic` restores end-to-end concolic
          # solving" -- rides on tfuzzconcolicbridge_real being DISCOVERED by
          # the glob above. The zero-count guard catches a broken mount; it
          # does not catch a rename or a glob edit that drops one named
          # suite, and half (2) would then stop being checked with every leg
          # still green. The probe alone passes identically if
          # nelli/concolic were deleted outright, which is exactly what
          # "both halves, or it has not landed" forbids -- so this pin is not
          # optional.
          foreach ($required in @('tfuzzconcolicbridge_real', 'tfuzzconcolicassist',
                                  'tfuzzconcolicmismatch', 'tfuzzconcolicdegrade')) {
            if ($tests.BaseName -notcontains $required) {
              throw "half-(2) pin missing: $required was not discovered. The RFC-z3-optional seam is no longer end-to-end checked on this leg -- see docs/rfc/0004-z3-optional.md."
            }
          }
          $failed = @()
          foreach ($t in $tests) {
            Write-Host "==> $($t.Name)"
            nim c -r --cc:vcc --threads:on --hints:off --colors:off `
              --nimcache:_nimcache `
              --path:src --path:_deps\z3\src --path:_deps\softlink\src `
              --cincludes:C:\z3\include "tests\$($t.Name)"
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          # RFC-z3-optional S2: contract tests as NAMED steps, not glob
          # extensions. Neither of these matches ^(tfuzz|tdb|tengine_), so no
          # leg has ever run them -- which is exactly how both came to sit RED
          # without anyone noticing:
          #
          #   tsmoke.nim         asserts the surface contract this RFC
          #                      restores ("internal modules are not
          #                      bulk-re-exported through nelli"); red from
          #                      v0.6.0 until this branch.
          #   trequiresinit.nim  asserts nelli never default-constructs a
          #                      user's {.requiresInit.} element type. It has
          #                      its own .nim.cfg escalating UnsafeDefault /
          #                      UnsafeSetLen / ProveInit to ERRORS, so it is
          #                      a compile-level tripwire -- and it had failed
          #                      to compile at all on main.
          #
          # NOTE on trequiresinit: symex-mingw.yaml's header ledgers it as
          # "known to fail on Windows for environment/platform reasons" and
          # says a future non-symex leg should SKIP-LIST it. That ledger
          # predates the optbox fix, and the Linux failure it was written
          # against was this same ProveInit error -- so the entry may simply
          # be stale. Pinning it here is a deliberate, cheap experiment to
          # find out on a real runner, since it cannot be tested from the
          # Linux dev host. If this step goes red for a genuinely
          # platform-specific reason, drop `trequiresinit` from this list and
          # write the reason into the ledger -- do NOT weaken the step.
          #
          # Turning a contract test green without pinning it just resets the
          # same trap. Named rather than globbed for the same reason the
          # half-(2) pin above is explicit: a surface contract should not
          # depend on filename luck.
          #
          # tsymex_rfc0005_s8ab_letaudit.nim (RFC-0005 S8af): the
          # compile-time-VM let-aliasing guard. It already runs on
          # symex-mingw.yaml (auto-derived from nelli.nimble's `tsymex_*`
          # corpus), but neither fuzzer leg's glob matches its name
          # (`^(tfuzz|tdb|tengine_)`, nor the named-exact list) even though
          # part of its audited scope -- `fuzzmacro.nim`, `derive.nim`,
          # `dsl.nim`, `coverage.nim`, `mutation.nim`, `concolic.nim`,
          # `strategy.nim`, `parallel.nim` -- is fuzzer-side code. Pinned
          # here (and in fuzzer-mingw.yaml) so the guard is exercised under
          # BOTH C compilers, not only mingw-via-symex-mingw.
          #
          # RFC-0005 S8ah: this SAME suite also gets `-d:nelliVmAliasAudit`
          # (ONLY this one -- see fuzzer-mingw.yaml's identical comment for
          # why: `tsmoke`/`trequiresinit` import neither `symex.nim` nor
          # `concolic.nim`, so the define is a no-op for them, and adding it
          # to the whole glob-discovered loop above would multiply a real,
          # measured ~15s-per-compile cost across every fuzzer suite for no
          # benefit). This test file imports BOTH `nelli/symex {.all.}` and
          # `nelli/concolic {.all.}`, so one compile here exercises both
          # modules' build-time self-audit blocks under MSVC.
          foreach ($named in @('tsmoke', 'trequiresinit', 'tsymex_rfc0005_s8ab_letaudit')) {
            Write-Host "==> $named.nim (contract test)"
            $extraDefs = @()
            if ($named -eq 'tsymex_rfc0005_s8ab_letaudit') { $extraDefs = @('-d:nelliVmAliasAudit') }
            nim c -r --cc:vcc --threads:on --hints:off --colors:off `
              --nimcache:_nimcache `
              --path:src --path:_deps\z3\src --path:_deps\softlink\src `
              --cincludes:C:\z3\include @extraDefs "tests\$named.nim"
            if ($LASTEXITCODE -ne 0) { $failed += "$named.nim" }
          }

          if ($failed.Count -gt 0) {
            Write-Host "FAILED: $($failed -join ', ')"
            exit 1
          }
          Write-Host "All $($tests.Count) discovered Windows MSVC fuzzer suites passed, plus the named contract tests and the z3-free probe."
          '@ | Set-Content -Path _ci\run-msvc-tests.ps1 -Encoding utf8

      - name: Run fuzzer + db test suite under MSVC (glob-discovered)
        shell: pwsh
        env:
          # NELLI_NO_COV_BACKEND: this leg has cl.exe and NO gcc/clang, so the
          # external-C coverage scaffold (tests/fuzzsupport.nim's
          # buildInstrumented*) genuinely has no backend to build with here.
          # Individual scaffold tests already skip on `available(...)`; the one
          # canary that ASSERTS a backend exists is told, explicitly, that this
          # environment does not promise one. Every other environment (Linux dev
          # image, the mingw leg) keeps the loud failure, so a lost gcc there
          # still trips it.
          NELLI_NO_COV_BACKEND: "1"
        run: |
          # Runs directly on the runner now -- no container, so no bind mounts
          # and no separate PATH plumbing for libz3.dll (the Install Z3 step's
          # $env:GITHUB_PATH entry is inherited here, unlike by a container).
          pwsh -NoProfile -ExecutionPolicy Bypass -File _ci\run-msvc-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "MSVC suite failed (exit $LASTEXITCODE) -- see the diagnostics block above for env/Z3/cl.exe state" }

  # Partition the walker-test glob once, on Linux, and hand each shard its list.
  # The script's self-check fails this job (and so the whole leg) when the
  # union of the shards is not exactly the glob.
  shards:
    name: walker shard plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      shard_ids: ${{ steps.plan.outputs.shard_ids }}
      shards_json: ${{ steps.plan.outputs.shards_json }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Partition the walker tests and self-check the partition
        id: plan
        env:
          TESTS_GLOB: ${{ inputs.tests_glob || 'tests/tsymex_0016_*.nim' }}
        run: python3 -I scripts/shard-walker-tests.py "$TESTS_GLOB" "$WALKER_SHARDS"

  # RFC-0016 W1-m: the walker on MSVC. mingw (symex-mingw) cannot catch
  # MSVC-only defect classes, so every tsymex_0016_* file is compiled with
  # --cc:vcc and run against the installed Z3 4.13.4. Driven by a glob, not
  # a list, so a new RFC-0016 file is covered on arrival; a glob matching
  # zero files FAILS (a renamed prefix must not read as a green leg).
  # Nim picks up each file's sibling .nim.cfg itself (project config is
  # not skipped here).
  walker:
    name: walker (vcc shard ${{ matrix.shard }})
    needs: shards
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.shards.outputs.shard_ids) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-msvc-leg

      - name: Run RFC-0016 walker tests under MSVC (vcc)
        shell: pwsh
        env:
          SHARDS_JSON: ${{ needs.shards.outputs.shards_json }}
          SHARD: ${{ matrix.shard }}
          NIM_FLAGS: ${{ inputs.nim_flags || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "compiler: vcc (nim --cc:vcc)"
          nim --version
          $prev = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          & cmd /c "cl.exe 2>&1" | Select-Object -First 2 | ForEach-Object { Write-Host $_ }
          $ErrorActionPreference = $prev
          $extra = @($env:NIM_FLAGS -split '\s+' | Where-Object { $_ })
          Write-Host "extra flags: $($extra -join ' ')"
          $names = @(($env:SHARDS_JSON | ConvertFrom-Json).$($env:SHARD))
          Write-Host "shard $($env:SHARD): $($names.Count) test files"
          if ($names.Count -eq 0) {
            throw "shard $($env:SHARD) has an empty test list -- refusing to report a false green"
          }
          $failed = @()
          foreach ($n in $names) {
            $t = Get-Item $n
            Write-Host "==> $($t.Name) [vcc]"
            nim c -r --cc:vcc --threads:on --hints:off --colors:off @extra `
              --nimcache:_nimcache-0016 `
              --path:src --path:_deps\z3\src --path:_deps\softlink\src `
              --cincludes:C:\z3\include $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed.Count -gt 0) {
            Write-Host "FAILED under vcc: $($failed -join ', ')"
            exit 1
          }
          Write-Host "All $($names.Count) shard-$($env:SHARD) RFC-0016 walker tests passed under vcc."

  # The join. Keeps the leg's original job name so a required-check rule or
  # anything else keyed on `fuzzer-msvc` keeps working.
  fuzzer-msvc:
    needs: [suites, shards, walker]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part of the leg succeeded
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS" | python3 -I -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          print({k: v["result"] for k, v in needs.items()})
          sys.exit(1 if bad else 0)'


      # NO cpp/MSVC STEP -- it was added here on 2026-09-02 and REMOVED the
      # same day, because it answered its own question in the negative.
      #
      # RFC-0001 carried "the Windows container's cpp/MSVC pairing is
      # unverified" as an open item. Adding `nim cpp --cc:vcc` here verified
      # it: the pairing is BROKEN, and the failure is upstream of nelli.
      # Measured, run 33699124168:
      #
      #   @pz3@sffi.nim.cpp(10025): error C2664: 'bool Z3_global_param_get(
      #       Z3_string,Z3_string_ptr)' -- Conversion from 'void*' to pointer
      #       to non-'void' type
      #   @pz3@sffi.nim.cpp(10025): error C2955: 'softlink_strip_ptr_const':
      #       use of class template requires template argument list
      #   @pz3@sffi.nim.cpp(10026): error C2057: expected constant expression
      #
      # C++ does not implicitly convert `void*` to a typed pointer the way C
      # does, and `softlink_strip_ptr_const` is a class template used without
      # a template argument list. The defect is in SOFTLINK's generated FFI
      # shim (via nim-z3), not in this repo -- which is why it reproduces
      # nowhere else and why no amount of work here would fix it.
      #
