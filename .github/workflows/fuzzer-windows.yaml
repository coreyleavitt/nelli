name: fuzzer-windows

# Windows CI leg for the fuzzer (RFC-fuzzer-nextgen slice Eci).
#
# WHY THIS EXISTS: the fuzzer's Track E/G/S/U implementation was TDD'd on
# Linux/podman; the Windows-specific slices (E4a/E4b/E4c — CreateProcess
# workers, CreateFileMapping coverage transport, Job Object limits) can only
# be RUN-verified on a real Windows host. The local dev container carries a
# mingw cross-compile CHECK (scripts/dt-crosswin.sh) that catches build-time
# breakage fast, but this leg is the RUN-verification channel — see
# docs/RFC-fuzzer-nextgen.windows-capability.md.
#
# TEST DISCOVERY IS A GLOB, not a hand-curated array (the Eci "generalize
# beyond the fixed symex list" requirement): every tests/tfuzz*.nim and
# tests/tdb*.nim is discovered and run. A test whose subject is POSIX-only
# self-gates in-file (`when defined(posix)` around its suites, with an
# explicit SKIP echo on Windows) rather than being excluded here, so new
# tests are picked up automatically and an exclusion list can never rot.
#
# Deps are cloned at the EXACT commit SHAs recorded in milpa.lock — same
# discipline as symex-windows.yaml. Z3 is installed because several fuzz
# tests (the concolic-bridge headlines) exercise the real Z3 bridge.

on:
  push:
    branches: [main, rfc-fuzzer-nextgen]
  pull_request:

jobs:
  fuzzer-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Z3 4.13.4 (x64-win)
        shell: pwsh
        run: |
          $v = '4.13.4'
          curl.exe -L -o C:\z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-$v/z3-$v-x64-win.zip"
          if ($LASTEXITCODE -ne 0) { throw 'z3 download failed' }
          Expand-Archive -Path C:\z3.zip -DestinationPath C:\ -Force
          Move-Item "C:\z3-$v-x64-win" C:\z3
          if (!(Test-Path C:\z3\bin\libz3.dll)) { throw 'libz3.dll missing' }
          if (!(Test-Path C:\z3\include\z3.h))  { throw 'z3.h missing' }
          Add-Content $env:GITHUB_PATH 'C:\z3\bin'

      - name: Clone deps at milpa.lock provenance SHAs
        shell: pwsh
        run: |
          $lock = Get-Content milpa.lock -Raw
          New-Item -ItemType Directory -Force _deps | Out-Null
          $pattern = 'dep "(?<name>[^"]+)" \{[\s\S]*?provenance \{[\s\S]*?url "(?<url>[^"]+)"[\s\S]*?commit_sha "(?<sha>[0-9a-f]{40})"'
          foreach ($m in [regex]::Matches($lock, $pattern)) {
            $name = $m.Groups['name'].Value
            $url  = $m.Groups['url'].Value
            $sha  = $m.Groups['sha'].Value
            Write-Host "dep $name -> $url @ $sha"
            git clone $url "_deps/$name"
            git -C "_deps/$name" checkout --detach $sha
            if ($LASTEXITCODE -ne 0) { throw "checkout failed for $name" }
          }
          if (!(Test-Path _deps/z3) -or !(Test-Path _deps/softlink)) {
            throw 'expected deps z3 + softlink not resolved from milpa.lock'
          }

      - name: Run fuzzer + db test suite (glob-discovered)
        shell: pwsh
        run: |
          $tests = Get-ChildItem tests -Filter 't*.nim' |
            Where-Object { $_.Name -match '^(tfuzz|tdb)' } |
            Sort-Object Name
          Write-Host "discovered $($tests.Count) test files"
          $failed = @()
          foreach ($t in $tests) {
            Write-Host "==> $($t.Name)"
            nim c -r --threads:on --hints:off --colors:off `
              --nimcache:C:\nimcache `
              --path:src --path:_deps/z3/src --path:_deps/softlink/src `
              --cincludes:C:/z3/include "tests/$($t.Name)"
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed.Count -gt 0) {
            Write-Host "FAILED: $($failed -join ', ')"
            exit 1
          }
          Write-Host "All $($tests.Count) Windows fuzzer suites passed."
