name: symex-linux

# RFC-0016 CI-A1/A3: the native Linux leg for the whole suite, with no
# container. Patched Nim from the OCI artifact, Z3 5.1.0 from its release
# archive, PCRE 8.45 from source (all hash-pinned and cached; the shared
# .github/actions/setup-symex-linux).
#
# SHAPE. `derive` cuts every test registered in nelli.nimble's `test` task
# into shards (scripts/derive-linux-shards.py: the Linux twin of
# derive-ci-suites.ps1, placed by scripts/ci-suite-seconds.tsv). Each `sweep`
# shard runs scripts/sweep.sh --host --derive on its slice and uploads the
# log with the .summary / .env / .drift / .warnings sidecars sweep.sh writes.
# `gate` joins the shard logs and fails on
#   - a registered test with no result (a shard died or was cut),
#   - a red test that is not in tests/0016-allowlist/linux-host-known-red.txt,
#   - an allowlisted test that PASSED (a stale entry; the list cannot rot).
# `watchdog` fails when the K8a heartbeat or an rfc-0016-intake issue is over
# seven days old (scripts/rfc0016-watchdog.sh; its header holds the
# absent-heartbeat policy). `pins` is the K1-0 pin join and the README kind
# check, which are not sharded. `universe` is K1a-ci's post-shard join of the
# shards' pin records (scripts/universe-join.sh).
#
# A red outside the allowlist is the signal; the suite is not green on a good
# day, so the allowlist is the recorded baseline and "what moved against it" is
# the gate. Adding an entry needs a reason on its line and, for a defect, a
# row in the RFC (§5.3 or the INT table).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: ""
      tests_regex:
        description: "Run only test basenames matching this REGEX (empty = the whole registered suite)"
        required: false
        default: ""
  push:
    branches: [main, 'rfc-*']
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards_json: ${{ steps.derive.outputs.shards_json }}
      shard_ids: ${{ steps.derive.outputs.shard_ids }}
      regexes_json: ${{ steps.derive.outputs.regexes_json }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Derive and shard the registered suite
        id: derive
        env:
          NELLI_TESTS_REGEX: ${{ github.event_name == 'workflow_dispatch' && inputs.tests_regex || '' }}
        run: python3 -I scripts/derive-linux-shards.py

  sweep:
    needs: derive
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.derive.outputs.shard_ids) }}
    name: sweep (shard ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-symex-linux

      - name: Sweep shard ${{ matrix.shard }} on the host (scripts/sweep.sh --host)
        shell: bash
        env:
          REGEXES_JSON: ${{ needs.derive.outputs.regexes_json }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/sweep"
          regex="$(printf '%s' "$REGEXES_JSON" | jq -r --arg s "$SHARD" '.[$s]')"
          [ -n "$regex" ] && [ "$regex" != null ] || { echo "shard $SHARD: no regex"; exit 1; }
          start=$SECONDS
          # sweep.sh exits 0 unless it could not run; the log is the record
          # and the `gate` job reads it. A red test does not fail the shard.
          scripts/sweep.sh --host --derive -j 4 -f "$regex" "$RUNNER_TEMP/sweep/shard-$SHARD.log"
          rc=$?
          {
            echo "### shard $SHARD: $(( (SECONDS - start) / 60 )) min $(( (SECONDS - start) % 60 )) s"
            echo '```'
            cat "$RUNNER_TEMP/sweep/shard-$SHARD.log.summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "shard $SHARD wall time: $(( SECONDS - start )) s"
          exit "$rc"

      - name: Upload the shard log and sidecars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symex-linux-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/sweep/
          if-no-files-found: warn

  gate:
    needs: [derive, sweep]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: symex-linux-shard-*
          path: shards
          merge-multiple: true

      - name: Join the shards against the known-red allowlist
        env:
          SHARDS_JSON: ${{ needs.derive.outputs.shards_json }}
          PARTIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.tests_regex != '' && '1' || '' }}
        run: |
          set -uo pipefail
          bash scripts/check-linux-allowlist.sh --self-test
          printf '%s' "$SHARDS_JSON" | jq -r '.[][]' > "$RUNNER_TEMP/expected.txt"
          rc=0
          bash scripts/check-linux-allowlist.sh tests/0016-allowlist/linux-host-known-red.txt \
            "$RUNNER_TEMP/expected.txt" shards/shard-*.log > "$RUNNER_TEMP/gate.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/gate.txt"
          { echo '### symex-linux gate'; echo '```'; cat "$RUNNER_TEMP/gate.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # RFC-0016 K1a-ci. The shards' pin records (scripts/sweep.sh writes each
  # shard's into <outlog>.pins/, which the shard artifact carries) joined by
  # the universe test, scoped to this leg's row. Zero records fails.
  universe:
    needs: [derive, sweep]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-symex-linux

      - uses: actions/download-artifact@v4
        with:
          pattern: symex-linux-shard-*
          path: records
          merge-multiple: true

      - name: Universe join over the shards' pin records
        shell: bash
        env:
          NELLI_HOST: "1"
          PARTIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.tests_regex != '' && '1' || '' }}
        run: |
          set -uo pipefail
          export NELLI_NIM_FLAGS="--cc:gcc --colors:off --path:src --path:_deps/z3/src --path:_deps/softlink/src --cincludes:$NELLI_Z3_INCLUDE"
          bash scripts/universe-join.sh --self-test
          mkdir -p "$RUNNER_TEMP/universe"
          UNIVERSE_JOIN_WORK="$RUNNER_TEMP/universe" \
            bash scripts/universe-join.sh ${PARTIAL:+--partial} symex-linux linux-c records \
            2>&1 | tee "$RUNNER_TEMP/universe/join.txt"
          rc=${PIPESTATUS[0]}
          { echo '### symex-linux universe join'; echo '```'; tail -n 60 "$RUNNER_TEMP/universe/join.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Watchdog self-test
        run: bash scripts/rfc0016-watchdog.sh --self-test

      - name: K8a heartbeat and rfc-0016-intake issue age
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/rfc0016-watchdog.sh

  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-symex-linux

      - name: README decline catalogue names every kind (scripts/check-readme-kinds.sh)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          bash scripts/check-readme-kinds.sh
          bash scripts/check-readme-kinds.sh --self-test

      - name: Work-list tables are the render of the TOML (scripts/check-worklist.sh)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          NELLI_HOST: "1"
          NELLI_NIM_FLAGS: "--cc:gcc --colors:off"
        run: |
          bash scripts/check-worklist.sh
          bash scripts/check-worklist.sh --self-test

      - name: K1-0 pin join (scripts/k1lite.sh on the host)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          NELLI_HOST: "1"
        run: |
          set -uo pipefail
          # The same host flags sweep.sh --host exports (the artifact ships Nim
          # alone: C compiler, Z3 headers and dep paths are named here).
          export NELLI_NIM_FLAGS="--cc:gcc --colors:off --path:src --path:_deps/z3/src --path:_deps/softlink/src --cincludes:$NELLI_Z3_INCLUDE"
          mkdir -p "$RUNNER_TEMP/k1lite"
          # Runs the W1 suites into a fresh pin dir, then the join.
          scripts/k1lite.sh -k "$RUNNER_TEMP/k1lite/pins" 2>&1 \
            | tee "$RUNNER_TEMP/k1lite/k1lite.log"
          exit "${PIPESTATUS[0]}"

      - name: K1-0 pin join, cpp backend (scripts/k1lite.sh -b cpp on the host)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          NELLI_HOST: "1"
        run: |
          set -uo pipefail
          export NELLI_NIM_FLAGS="--cc:gcc --colors:off --path:src --path:_deps/z3/src --path:_deps/softlink/src --cincludes:$NELLI_Z3_INCLUDE"
          mkdir -p "$RUNNER_TEMP/k1lite-cpp"
          g++ --version | head -1
          scripts/k1lite.sh -b cpp -k "$RUNNER_TEMP/k1lite-cpp/pins" 2>&1 \
            | tee "$RUNNER_TEMP/k1lite-cpp/k1lite.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload the K1-0 cpp pins and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symex-linux-k1lite-cpp
          path: ${{ runner.temp }}/k1lite-cpp/
          if-no-files-found: warn

      - name: Upload the K1-0 pins and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symex-linux-k1lite
          path: ${{ runner.temp }}/k1lite/
          if-no-files-found: warn
