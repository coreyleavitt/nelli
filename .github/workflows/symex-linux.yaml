name: symex-linux

# RFC-0016 CI-A1: native Linux provisioning for the symex engine, with no
# container. Patched Nim from the OCI artifact, Z3 5.1.0 from its release
# archive, PCRE 8.45 from source (both hash-pinned and cached). For now it
# runs scripts/sweep.sh --host (CI-A2: the podman sweep's runner without
# podman); the default run set is ONE Z3 file and ONE PCRE-using file, and a
# dispatch can widen it with tests_regex / derive. CI-A3 widens the push run.
# Triggers are deliberately narrow until CI-A3: dispatch and rfc-* pushes.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: ""
      tests_regex:
        description: "sweep.sh -f REGEX over test basenames (use . for every test in the run set)"
        required: false
        default: "tsymex_0016_k9a_pins|tsymex_phase15_S6b_regex"
      derive:
        description: "Run set from nelli.nimble's test task (sweep.sh --derive) instead of the tests/t*.nim glob"
        type: boolean
        required: false
        default: false
  push:
    branches: ['rfc-*']
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - 'README.md'
      - 'CHANGELOG.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  one-file:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install the patched Nim toolchain (OCI artifact)
        uses: ./.github/actions/setup-nim-artifact
        with:
          tag: 2.2.10-linux-x64

      - name: Install Z3 5.1.0
        uses: ./.github/actions/setup-z3-linux

      - name: Install PCRE 8.45
        uses: ./.github/actions/setup-pcre1-linux

      - name: Clone deps at milpa.lock provenance SHAs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _deps
          python3 -I - <<'PY'
          import re, subprocess
          lock = open('milpa.lock').read()
          pat = re.compile(r'dep "([^"]+)" \{[\s\S]*?provenance \{[\s\S]*?url "([^"]+)"[\s\S]*?commit_sha "([0-9a-f]{40})"')
          for name, url, sha in pat.findall(lock):
              print('dep', name, url, sha, flush=True)
              subprocess.check_call(['git', 'clone', url, '_deps/' + name])
              subprocess.check_call(['git', '-C', '_deps/' + name, 'checkout', '--detach', sha])
          PY
          test -d _deps/z3 && test -d _deps/softlink

      - name: Report toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          nim --version | head -1
          gcc --version | head -1
          cat > "$RUNNER_TEMP/ver.nim" <<'NIM'
          import z3
          echo "Z3: ", z3FullVersion()
          NIM
          nim c -r --cc:gcc --hints:off --colors:off \
            --path:_deps/z3/src --path:_deps/softlink/src \
            --cincludes:"$NELLI_Z3_INCLUDE" \
            --nimcache:"$RUNNER_TEMP/nc-ver" "$RUNNER_TEMP/ver.nim"
          echo "PCRE: $("$NELLI_PCRE_PREFIX/bin/pcretest" -C | head -1)"
          ls -l "$NELLI_PCRE_PREFIX"/lib/libpcre.so.1*

      - name: Sweep on the host (scripts/sweep.sh --host)
        shell: bash
        env:
          TESTS_REGEX: ${{ github.event_name == 'workflow_dispatch' && inputs.tests_regex || 'tsymex_0016_k9a_pins|tsymex_phase15_S6b_regex' }}
          DERIVE: ${{ inputs.derive && '--derive' || '' }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/sweep"
          # sweep.sh exits 0 unless it could not run; the log is the record.
          # The step fails if any selected test failed.
          scripts/sweep.sh --host $DERIVE ${TESTS_REGEX:+-f "$TESTS_REGEX"} \
            "$RUNNER_TEMP/sweep/sweep.log"
          cat "$RUNNER_TEMP/sweep/sweep.log.summary" >> "$GITHUB_STEP_SUMMARY"
          awk '$1 != "0" && $1 != "skip" { bad = 1 } END { exit bad }' \
            "$RUNNER_TEMP/sweep/sweep.log"

      - name: K1-0 pin join (scripts/k1lite.sh on the host)
        shell: bash
        env:
          NELLI_HOST: "1"
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/k1lite"
          # Runs the seven W1 suites into a fresh pin dir, then the join.
          scripts/k1lite.sh -k "$RUNNER_TEMP/k1lite/pins" 2>&1 \
            | tee "$RUNNER_TEMP/k1lite/k1lite.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload the sweep log and sidecars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symex-linux-sweep
          path: |
            ${{ runner.temp }}/sweep/
            ${{ runner.temp }}/k1lite/
          if-no-files-found: warn
