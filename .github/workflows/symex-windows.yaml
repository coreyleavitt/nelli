name: symex-windows

# Windows CI leg for the symex engine (chapulin 0.1.0 re-test, 2026-08).
#
# WHY THIS EXISTS: nelli's own verification (the symex sweeps, the RFC's
# "healed" checks, the both-backend DoD runs) only ever ran on Linux/podman —
# and the chapulin re-test showed that the axis that actually diverged in the
# field was the PLATFORM, not the backend: Windows main-thread stacks are
# 1-2 MB vs 8 MB on Linux (catalog #11 was a Windows-only stack overflow
# reported as "healed" from Linux), and the Windows libz3 build (4.13.4, the
# bottom of nim-z3's supported 4.13.x-4.16.x window) can legitimately return
# different sat/unsat/unknown verdicts than the podman image's newer build.
# "Both backends green" cannot catch either. This leg runs the full symex
# suite corpus, sharded, plus the round-6 scan-tail regression pins natively
# on windows-latest.
#
# Deps are cloned at the EXACT commit SHAs recorded in milpa.lock
# (provenance.commit_sha) — no milpa install needed on the runner, and the
# pins can never drift from what a `milpa fetch` build uses. Z3 is pinned to
# the same 4.13.4 x64-win release the chapulin-symex toolchain image
# installs (Dockerfile.symex in the chapulin repo) so CI reproduces the
# field environment, divergent-verdict risk included.
#
# TWO-TIER JOB LAYOUT (0.5.1 postmortem): the leg originally ran a fixed
# prefix of suites in one job. At walker v105 one of the round-6 scan suites
# pegs a hosted runner hard enough that GitHub kills it ("runner lost
# communication") — and a killed runner uploads NO logs, so the failing
# suite could not even be identified from CI. The corpus job stays sharded
# (below); each round-6 scan-tail suite runs as its OWN matrix job so a
# runner death names its suite in the job title, a heavy Z3 query gets a
# whole runner to itself, and surviving jobs keep their logs.
#
# DERIVED CORPUS, NOT A HARDCODED LIST (re-review finding, round 6): this
# leg used to hardcode a 28-suite corpus list and a 9-suite scan-tail matrix
# while nelli.nimble's own `test` task carried ~220 tsymex_* entries — the
# two lists were maintained by hand and drifted apart silently. That
# divergence mechanism let a suite (tsymex_r6_n31_block_counter, see the
# handoff ledger) sit red and unnoticed in CI for 12 walker versions, because
# registering a suite in nelli.nimble never made it reachable from here. The
# `derive-suites` job below parses nelli.nimble's `test` task at run time and
# computes the corpus from it, so a newly registered tsymex_* suite is
# automatically in CI the next run — no second list to remember to update.
# The scan-tail matrix suites (runner-isolation reasons, above) and an
# explicit, annotated SKIP list (known-red suites, each with a ledger
# reason) are subtracted from the derived set; everything else lands in the
# sharded corpus. A parse failure or a suspiciously small derived count
# fails the `derive-suites` step LOUDLY (assertions on the raw suite count
# and the corpus floor) rather than silently running an empty or truncated
# leg — the whole point is that this mechanism must fail loud, not quiet.
#
# KNOWN RISK — read before triaging a red run after this change lands:
# roughly 180 of the ~207 derived corpus suites have never previously run
# under the mingw-built Windows walker; they only ran under the MSVC
# container build (local dev) or not on Windows at all. N46 (mingw-walker
# divergence, High, open per the round-6 ledger) predicts some of these may
# produce different verdicts or run long under mingw. That is EXPECTED
# DISCOVERY from finally giving these suites a CI leg, not a sign this
# workflow is broken — triage each red the same way any other N46-family
# finding gets triaged. The SKIP list above is the pressure valve for a
# suite that turns out to be genuinely mingw-incompatible; every addition to
# it requires a ledger entry naming the reason, the same as the initial five
# entries below carry one inline.
#
# SCOPE OF THIS LEG: symex suites (tsymex_*) only. nelli.nimble's `test`
# task also carries the base proptest suites (tsmoke, tchoice, tengine, the
# tfuzz* family, etc.) — this repository currently has no CI workflow that
# runs the `test` task at all; the only other workflow
# (.github/workflows/tianguis-publish.yaml) packs and publishes a release,
# it does not run tests. Bringing the non-symex suites under CI is out of
# scope for this leg. Separately, three suites (tfuzzcbuild, tfuzzexec,
# trequiresinit) are known to fail on Windows for environment/platform
# reasons unrelated to symex and are ledgered — they would need to be
# skip-listed on arrival in any future non-symex Windows leg, not fixed
# here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  derive-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards_json: ${{ steps.derive.outputs.shards_json }}
    steps:
      - uses: actions/checkout@v6

      - name: Derive + shard the symex suite corpus from nelli.nimble
        id: derive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $nimbleText = Get-Content -Raw nelli.nimble

          # Isolate the `test` task's suite array: from `for f in [` to the
          # matching `]:`. If nelli.nimble's task syntax ever changes shape,
          # this match fails and we throw below rather than silently
          # deriving nothing.
          $taskMatch = [regex]::Match($nimbleText, '(?s)task test,.*?for f in \[(?<body>.*?)\]:')
          if (-not $taskMatch.Success) {
            throw "derive-suites: could not locate 'task test' suite array in nelli.nimble -- parser is out of sync with the file format"
          }
          $body = $taskMatch.Groups['body'].Value

          $allNames = [regex]::Matches($body, '"(?<name>[^"]+)"') | ForEach-Object { $_.Groups['name'].Value }
          if ($allNames.Count -lt 50) {
            throw "derive-suites: parsed suspiciously few task entries ($($allNames.Count)) -- treating as a parse failure"
          }

          $allTsymex = $allNames | Where-Object { $_ -like 'tsymex_*' } | Sort-Object -Unique

          # Scan-tail matrix suites: kept explicit for runner-isolation
          # reasons (each gets its own CI job so a runner death names its
          # suite and a heavy Z3 query gets a whole runner to itself). Do
          # not derive these -- must match the `scan-tail` job's matrix
          # below exactly.
          $matrixSuites = @(
            'tsymex_r6_b5_chained',
            'tsymex_r6_b6_optionregion',
            'tsymex_r6_nulwitness',
            'tsymex_r6_bug2_scopeddecline',
            'tsymex_r6_a6r_callwitness',
            'tsymex_r6_b7r_bytescan',
            'tsymex_r6_b7r2_pathscope',
            'tsymex_phase15_g8_multi_param',
            'tsymex_phase15_g10_smoke'
          )

          # Loud cross-check (design finding, round-6 re-review): the
          # `$matrixSuites` list above and the `scan-tail` job's own YAML
          # `matrix: suite:` list (below, in this SAME file) are hand-synced
          # twins -- nothing previously enforced they match. A silent drift
          # (an entry edited into/out of one list but not the other) either
          # double-runs a suite (present in both the derived corpus AND the
          # scan-tail matrix) or drops it from CI entirely (excluded from
          # the corpus via `$matrixSuites`, but no longer present in
          # scan-tail's own matrix either) -- exactly the silent-divergence
          # failure mode the whole derive-suites mechanism exists to
          # prevent (see this workflow's header, "DERIVED CORPUS, NOT A
          # HARDCODED LIST"). `actions/checkout` already ran above, so this
          # file is on disk -- parse the scan-tail job's OWN matrix out of
          # it and assert set-equality against `$matrixSuites`, failing
          # loudly (naming exactly which suites are on which side) on any
          # drift instead of letting the two lists silently diverge.
          $selfWorkflowPath = '.github/workflows/symex-windows.yaml'
          $selfText = Get-Content -Raw $selfWorkflowPath
          $scanTailIdx = $selfText.IndexOf("`n  scan-tail:")
          if ($scanTailIdx -lt 0) {
            throw "derive-suites: could not locate the 'scan-tail:' job in $selfWorkflowPath -- cross-check parser is out of sync with the file format"
          }
          $scanTailText = $selfText.Substring($scanTailIdx)
          # Round-6 re-review (item 6, walker v115): each item line tolerates
          # an optional trailing `# comment` -- a bare `\S+` before the line's
          # `\r?\n` would swallow the whole run including any `#...` (corrupting
          # the parsed name) or, if a comment sits right after the whitespace-
          # only trailer, fail that single repetition and truncate the WHOLE
          # `(?<items>...)+` capture at that line (silently dropping every
          # entry from the comment onward) -- or, if the FIRST entry carries a
          # comment, fail the block match entirely and throw the misleading
          # "parser is out of sync" error above, even though the file is
          # perfectly well-formed YAML. The name-capture group excludes `#`
          # explicitly (`[^\s#]+`, not `\S+`) so a same-line comment can never
          # be appended onto the captured name either.
          $scanTailMatrixMatch = [regex]::Match($scanTailText,
            '(?s)matrix:\s*\r?\n\s*suite:\s*\r?\n(?<items>(?:\s*-\s*[^\s#]+[ \t]*(?:#[^\r\n]*)?\r?\n)+)')
          if (-not $scanTailMatrixMatch.Success) {
            throw "derive-suites: could not locate the scan-tail job's 'matrix: suite:' list in $selfWorkflowPath -- cross-check parser is out of sync with the file format"
          }
          $scanTailSuites = [regex]::Matches($scanTailMatrixMatch.Groups['items'].Value, '-\s*(?<name>[^\s#]+)') |
            ForEach-Object { $_.Groups['name'].Value }
          if ($scanTailSuites.Count -eq 0) {
            throw "derive-suites: parsed zero suites from the scan-tail job's matrix -- treating as a parse failure"
          }

          $matrixSuitesSet = [System.Collections.Generic.HashSet[string]]::new([string[]]$matrixSuites)
          $scanTailSuitesSet = [System.Collections.Generic.HashSet[string]]::new([string[]]$scanTailSuites)
          $onlyInDeriveMatrix = $matrixSuites | Where-Object { -not $scanTailSuitesSet.Contains($_) }
          $onlyInScanTailMatrix = $scanTailSuites | Where-Object { -not $matrixSuitesSet.Contains($_) }
          if ($onlyInDeriveMatrix.Count -gt 0 -or $onlyInScanTailMatrix.Count -gt 0) {
            $driftMsg = "derive-suites: '`$matrixSuites' (this step) and the scan-tail job's own matrix have drifted apart -- these two lists MUST be kept identical.`n"
            if ($onlyInDeriveMatrix.Count -gt 0) {
              $driftMsg += "  in derive-suites `$matrixSuites but MISSING from the scan-tail job matrix: $($onlyInDeriveMatrix -join ', ')`n"
            }
            if ($onlyInScanTailMatrix.Count -gt 0) {
              $driftMsg += "  in the scan-tail job matrix but MISSING from derive-suites `$matrixSuites: $($onlyInScanTailMatrix -join ', ')`n"
            }
            throw $driftMsg
          }
          Write-Host "matrix cross-check OK: $($matrixSuites.Count) suites identical in derive-suites `$matrixSuites and the scan-tail job matrix"

          # Explicit skip list -- every entry MUST carry a ledger reason.
          # Additions require a ledger entry (see the workflow header
          # comment); this is the pressure valve, not a place to silence
          # surprises. The three reactivated audit suites (A2a_atomicir,
          # A2a_chokepoint, N2_kindgate -- switched from staticRead to
          # runtime readFile to dodge MSVC C2026) are deliberately NOT
          # skip-listed: they should work on mingw.
          $skipReasons = [ordered]@{
            'tsymex_phase15_C4_hof'       = 'known-red, ledger N29 HOF lambda sort-mismatch class (predates round 6)'
            'tsymex_phase15_C6_smoke'     = 'known-red, ledger N29 HOF lambda sort-mismatch class (predates round 6)'
            'tsymex_phase15_S3_strindex'  = 'known-red pre-existing engine gap, ledgered this round, next-round seed'
            'tsymex_phase15_S10b_strconv' = 'known-red pre-existing engine gap, ledgered this round, next-round seed'
            'tsymex_phase15_A1_bitwise'   = 'known-red pre-existing, ledgered this round, next-round seed'
          }

          # Sanity: matrix/skip entries must actually exist in the nimble
          # task (guards against stale references as suites get renamed or
          # removed).
          $allSet = [System.Collections.Generic.HashSet[string]]::new([string[]]$allTsymex)
          foreach ($m in $matrixSuites) {
            if (-not $allSet.Contains($m)) { throw "derive-suites: matrix suite '$m' is not present in nelli.nimble's test task" }
          }
          foreach ($s in $skipReasons.Keys) {
            if (-not $allSet.Contains($s)) { throw "derive-suites: skip-listed suite '$s' is not present in nelli.nimble's test task" }
          }

          $excludeSet = [System.Collections.Generic.HashSet[string]]::new([string[]]($matrixSuites + [string[]]$skipReasons.Keys))
          $corpus = $allTsymex | Where-Object { -not $excludeSet.Contains($_) } | Sort-Object

          if ($corpus.Count -lt 150) {
            throw "derive-suites: derived corpus has only $($corpus.Count) suites (floor 150) -- likely a parse failure, failing loudly instead of running an empty/truncated CI leg"
          }

          $accountedFor = $matrixSuites.Count + $skipReasons.Count + $corpus.Count
          if ($accountedFor -ne $allTsymex.Count) {
            throw "derive-suites: accounting mismatch -- $($allTsymex.Count) total tsymex_* suites vs $accountedFor accounted for (matrix + skip + corpus)"
          }

          # Round-robin by index into 3 shards, deterministic given the
          # sorted corpus.
          $shardCount = 3
          $shards = @(
            (New-Object 'System.Collections.Generic.List[string]'),
            (New-Object 'System.Collections.Generic.List[string]'),
            (New-Object 'System.Collections.Generic.List[string]')
          )
          for ($i = 0; $i -lt $corpus.Count; $i++) {
            $shards[$i % $shardCount].Add($corpus[$i])
          }

          Write-Host "=== derive-suites accounting ==="
          Write-Host "total tsymex_* suites in nelli.nimble : $($allTsymex.Count)"
          Write-Host "scan-tail matrix (explicit)           : $($matrixSuites.Count)"
          Write-Host "skip list (annotated)                 : $($skipReasons.Count)"
          Write-Host "derived corpus (shard-eligible)       : $($corpus.Count)"
          for ($i = 0; $i -lt $shardCount; $i++) {
            Write-Host "  shard $i : $($shards[$i].Count) suites"
          }
          Write-Host ""
          Write-Host "skip list:"
          foreach ($k in $skipReasons.Keys) { Write-Host "  $k -- $($skipReasons[$k])" }

          $shardsObj = [ordered]@{
            '0' = @($shards[0])
            '1' = @($shards[1])
            '2' = @($shards[2])
          }
          $shardsJson = $shardsObj | ConvertTo-Json -Compress -Depth 5
          "shards_json=$shardsJson" >> $env:GITHUB_OUTPUT

  corpus:
    needs: derive-suites
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    name: corpus (shard ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v6

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Z3 4.13.4 (x64-win)
        shell: pwsh
        run: |
          $v = '4.13.4'
          curl.exe -L -o C:\z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-$v/z3-$v-x64-win.zip"
          if ($LASTEXITCODE -ne 0) { throw 'z3 download failed' }
          Expand-Archive -Path C:\z3.zip -DestinationPath C:\ -Force
          Move-Item "C:\z3-$v-x64-win" C:\z3
          if (!(Test-Path C:\z3\bin\libz3.dll)) { throw 'libz3.dll missing' }
          if (!(Test-Path C:\z3\include\z3.h))  { throw 'z3.h missing' }
          Add-Content $env:GITHUB_PATH 'C:\z3\bin'

      - name: Clone deps at milpa.lock provenance SHAs
        shell: pwsh
        run: |
          $lock = Get-Content milpa.lock -Raw
          New-Item -ItemType Directory -Force _deps | Out-Null
          $pattern = 'dep "(?<name>[^"]+)" \{[\s\S]*?provenance \{[\s\S]*?url "(?<url>[^"]+)"[\s\S]*?commit_sha "(?<sha>[0-9a-f]{40})"'
          foreach ($m in [regex]::Matches($lock, $pattern)) {
            $name = $m.Groups['name'].Value
            $url  = $m.Groups['url'].Value
            $sha  = $m.Groups['sha'].Value
            Write-Host "dep $name -> $url @ $sha"
            git clone $url "_deps/$name"
            git -C "_deps/$name" checkout --detach $sha
            if ($LASTEXITCODE -ne 0) { throw "checkout failed for $name" }
          }
          if (!(Test-Path _deps/z3) -or !(Test-Path _deps/softlink)) {
            throw 'expected deps z3 + softlink not resolved from milpa.lock'
          }

      - name: Run shard ${{ matrix.shard }} of the derived corpus
        shell: pwsh
        env:
          SHARDS_JSON: ${{ needs.derive-suites.outputs.shards_json }}
          SHARD_IDX: ${{ matrix.shard }}
        run: |
          $shards = $env:SHARDS_JSON | ConvertFrom-Json
          $tests = $shards.($env:SHARD_IDX)
          if (-not $tests -or $tests.Count -eq 0) {
            throw "corpus shard $($env:SHARD_IDX): empty suite list from derive-suites -- failing loudly"
          }
          Write-Host "shard $($env:SHARD_IDX): $($tests.Count) suites"
          $failed = @()
          foreach ($t in $tests) {
            Write-Host "==> $t"
            # -Wl,--stack: link an 8 MB main-thread stack (Linux parity).
            # Windows defaults to 1 MB, and deep walker/Z3 recursion
            # intermittently overflowed it as a silent crash (catalog #11
            # class).
            nim c -r --threads:on --hints:off --colors:off `
              --path:src --path:_deps/z3/src --path:_deps/softlink/src `
              --cincludes:C:/z3/include `
              --passL:"-Wl,--stack,8388608" "tests/$t.nim"
            if ($LASTEXITCODE -ne 0) { $failed += $t }
          }
          if ($failed.Count -gt 0) {
            Write-Host "FAILED: $($failed -join ', ')"
            exit 1
          }
          Write-Host 'All suites in this shard passed.'

  scan-tail:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite:
          - tsymex_r6_b5_chained
          - tsymex_r6_b6_optionregion
          - tsymex_r6_nulwitness
          - tsymex_r6_bug2_scopeddecline
          - tsymex_r6_a6r_callwitness
          - tsymex_r6_b7r_bytescan
          - tsymex_r6_b7r2_pathscope
          - tsymex_phase15_g8_multi_param
          - tsymex_phase15_g10_smoke
    name: scan-tail (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v6

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Z3 4.13.4 (x64-win)
        shell: pwsh
        run: |
          $v = '4.13.4'
          curl.exe -L -o C:\z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-$v/z3-$v-x64-win.zip"
          if ($LASTEXITCODE -ne 0) { throw 'z3 download failed' }
          Expand-Archive -Path C:\z3.zip -DestinationPath C:\ -Force
          Move-Item "C:\z3-$v-x64-win" C:\z3
          if (!(Test-Path C:\z3\bin\libz3.dll)) { throw 'libz3.dll missing' }
          if (!(Test-Path C:\z3\include\z3.h))  { throw 'z3.h missing' }
          Add-Content $env:GITHUB_PATH 'C:\z3\bin'

      - name: Clone deps at milpa.lock provenance SHAs
        shell: pwsh
        run: |
          $lock = Get-Content milpa.lock -Raw
          New-Item -ItemType Directory -Force _deps | Out-Null
          $pattern = 'dep "(?<name>[^"]+)" \{[\s\S]*?provenance \{[\s\S]*?url "(?<url>[^"]+)"[\s\S]*?commit_sha "(?<sha>[0-9a-f]{40})"'
          foreach ($m in [regex]::Matches($lock, $pattern)) {
            $name = $m.Groups['name'].Value
            $url  = $m.Groups['url'].Value
            $sha  = $m.Groups['sha'].Value
            Write-Host "dep $name -> $url @ $sha"
            git clone $url "_deps/$name"
            git -C "_deps/$name" checkout --detach $sha
            if ($LASTEXITCODE -ne 0) { throw "checkout failed for $name" }
          }
          if (!(Test-Path _deps/z3) -or !(Test-Path _deps/softlink)) {
            throw 'expected deps z3 + softlink not resolved from milpa.lock'
          }

      - name: Run ${{ matrix.suite }}
        shell: pwsh
        run: |
          # b5's B5-4 trip-wire is CI-skipped via -d:symexCiLeanB5: under the
          # mingw-built walker that one query ran a dedicated runner to death
          # (>80 min) while taking ~40 s under the MSVC container build. The
          # check stays pinned in the container-run nimble task; see the
          # comment in tests/tsymex_r6_b5_chained.nim.
          $extra = @()
          if ('${{ matrix.suite }}' -eq 'tsymex_r6_b5_chained') {
            $extra += '-d:symexCiLeanB5'
          }
          nim c -r --threads:on --hints:off --colors:off `
            --path:src --path:_deps/z3/src --path:_deps/softlink/src `
            --cincludes:C:/z3/include `
            --passL:"-Wl,--stack,8388608" @extra "tests/${{ matrix.suite }}.nim"
          if ($LASTEXITCODE -ne 0) { exit 1 }
