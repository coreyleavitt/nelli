name: tianguis-publish

# Publishes nelli to the tianguis Nim package registry.
#
# TWO ways to fire:
#   1. workflow_dispatch (manual, from the Actions tab) — pick a `ref`
#      (tag or SHA). Use `dry-run: true` (the default) for a first smoke
#      test: it still packs + pushes + cosign-signs the OCI artifact, but
#      the dispatch skips committing an index entry.
#   2. push of a "v*" tag — fires automatically and publishes for real
#      (dry-run defaults to false on a tag push).
#
# Runs the tianguis composite action in nelli's OWN job (a step under
# `steps:`, never a reusable-workflow `uses:` at the `jobs:` level) — the
# trust model requires it: a composite action executes inside this job, so
# cosign's Fulcio cert SAN and the sigstore attestation are stamped with
# nelli's own per-repo GitHub Actions identity, not a shared one. See
# coreyleavitt/tianguis docs/adoption/github.md for the full rationale.
#
# milpa is PUBLIC, so no MILPA_GIT_READ_PAT is needed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or SHA to publish (e.g. v0.1.0) — checked out and packed."
        required: true
        default: "v0.1.0"
      dry-run:
        description: "Smoke test: packs + pushes + signs the OCI artifact, but dispatch skips committing an index entry."
        type: boolean
        required: false
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # cosign keyless signing + the action's own
                        # attestation signing + the dispatch bearer token
      contents: read    # actions/checkout below
      packages: write   # push the OCI artifact to GHCR
    steps:
      - uses: actions/checkout@v6
        with:
          # On workflow_dispatch, check out the chosen ref (so the TAGGED
          # tree is published, not the branch HEAD); on a tag push,
          # github.ref already points at the tag.
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: coreyleavitt/tianguis/.github/actions/publish@main
        with:
          name: nelli            # matches milpa.kdl `name "nelli"`
          # On a tag push this is the tag (github.ref_name); on manual
          # dispatch it's the chosen ref. milpa accepts a leading "v" and
          # enforces that a <version>/v<version> git tag points at HEAD.
          version: ${{ github.event.inputs.ref || github.ref_name }}
          # target: defaults to ghcr.io/coreyleavitt/nelli — no override.
          # dispatch dry_run: true on manual smoke, false on a tag push.
          dry-run: ${{ github.event.inputs.dry-run || 'false' }}

    # ONE-TIME (manual, GitHub package settings UI): a newly created GHCR
    # package defaults to PRIVATE. After the FIRST successful publish, set
    # ghcr.io/coreyleavitt/nelli to Public at
    # https://github.com/users/coreyleavitt/packages/container/nelli/settings
    # — otherwise a consumer's unauthenticated `oras pull` (anyone installing
    # nelli via tianguis) cannot fetch it.
