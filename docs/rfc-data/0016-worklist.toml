title = "Intake #179 and #181 (`[nightly] msvc:tsymex_rfc0005_s8ct_isolation_d`), #180 and #182 (`msvc:tsymex_rfc0005_s8ct_reexec_d`): #181 duplicates #179 and #182 duplicates #180. Both suites failed to compile under vcc in one nightly only (run 42804432874, 2026-11-10, sha db6c3da6) with `interpretation requires too many iterations` at the default `maxLoopIterationsVM` (10M): isolation_d in `check_options.routineChecks` via `isStdlibFile` (`strimpl.endsWith`), reexec_d (`-d:nelliReplayReexec`) in `system/iterators`. Not a flake: the VM iteration count is a deterministic function of the tree, the toolchain and the path lengths, and the PRC-02 and PRC-07 work merged after the green 2026-11-09 nightly (8af8f2fe..db6c3da6) added compile-time parse and scan work that took these two compiles past 10M at Windows path lengths under the CI toolchain. Fixed with no VM-limit raise by 28df0350 (memoised whole-call-graph collectors, a named `RoutineSlots`, single-pass `fileDeclaresHook`, set-visited `replayFootprint`), a12b3ad0 (`isStdlibDecl`/`isRuntimeCode` answered once per file) and fe215c45 (`vm_alias_guard` visits through a set), which reached main in 75b36f5a (2026-11-11). Both suites have compiled and passed on every msvc nightly since (run 43006870598 on 2026-11-11 through run 44076804398 on 2026-11-17: 75 s and 64 s). The duplicate pairs were an intake defect: one key found twice in a run (the gate's new failure and the baseline diff's REGRESSED) opened two issues; `a555923d` collapses findings by (leg, test)"
