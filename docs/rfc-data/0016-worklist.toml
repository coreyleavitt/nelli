[[row]]
id = "CI-03"
table = "5.4"
title = "`s8by_remainder`'s units check is not deterministic under load"
state = "closed"
note = ": test-harness; fixed"
source = "S8ct"
evidence = "**Cause (S8cj):** the test's own threads each leaked a 17 MB Z3 context (nim-z3's current-context threadvar, never destroyed with the thread), so the process crossed Z3's 100 MB strategy threshold between `base` and the compared runs (PRC-32); under a sweep's load other processes do not matter (the count is per process), but a cpp build crossed the line at a different thread. Fixed: the threads release their contexts (`setCurrentContext(nil)`), so `tests/tsymex_rfc0005_s8by_remainder.nim:189`'s `check r.units == base.units` compares two threads at one count, which the probes show exact (mode 15r: six threads, one figure). Header corrected. Includes INT-04; owner S8cj. \\| `docs/rfc/0016-research/S8cj.md` conclusion 4; `s8cj/hist-c-z3-5.1.log` mode 15r"
