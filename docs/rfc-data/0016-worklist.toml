[[row]]
id = "PRC-07"
table = "5.2b"
title = "S8cu: exact unchecked semantics — model what a routine compiled with a check off actually does (overflow, bounds, range, field, nil, float checks), instead of the source-position decline Mechanism: K10a/K5a (§9, §8.3)."
state = "closed"
note = ": done (2026-11-09, rfc-0016-rangeoff, rfc-0016-prc0708): `--rangeChecks:off` and `--boundChecks:off` builds are walked as compiled (no `feCheckOption` for the build's own bit); an access Nim emits with no bound check is `ubArrayOutOfBounds` (row `index/unchecked`), the in-range witness exact; pins `tsymex_0016_rangeoff`, `tsymex_0016_boundoff`. `--objChecks:off` (`ubInvalidObjConversion`, row `conv/objDowncast`) and `--fieldChecks:off` (cpp: `ubInactiveVariantField`, row `field/inactiveBranch`; c: a wrong-branch read or write whose bytes the active arm's int/char/bool fields cover is exact, through `smt/variant_layout.nim` pinned against the native offsets; the rest declined path-locally, `fieldChecksOffLayout`) are walked as compiled, pins `tsymex_0016_objoff`, `tsymex_0016_fieldoff`. Slice B (2026-11-09): a value variant carries the union as one byte image on c (padding/tail zero, float bits, enum raw value, `{.packed.}` at alignment 1, all pinned natively) and its active member on cpp (a read through another member halts); A branch-changing discriminator write on c keeps the image and reads the new arm from it (C stores the tag alone; generated C checked), and a `range` field of foreign bytes is its raw value under `--rangeChecks:off` (`tsymex_0016_fieldrangeoff`). `field/inactiveBytes` keeps a bool, or a range with its checks on, overwritten with foreign bytes, pointer-payload arms, other layout pragmas, the else arm, multi-axis/inheritance variants; each is a pinned decline. The union bytes an object constructor naming every field leaves unwritten (the generated C zeroes only `var x: V`, `default(V)`, an omitting constructor) are indeterminate: a read of them is an indeterminate read (`ubIndeterminateRead`, the `{.noinit.}` convention). Float checks (2026-11-09, rfc-0016-prc0708): a routine with `nanChecks`/`infChecks` on at every reading is walked as compiled: each float `+ - * /` forks, after the operation, `FloatInvalidOpDefect` on a NaN result, then `FloatOverflowDefect` on `+inf` (`FloatUnderflowDefect` on `-inf`, `raiseFloatOverflow`), catchable; unary minus and conversions unchecked, as in the generated C; a compound assignment takes the build's options (system's generic `+=`, compiled under its definition's options; probed natively both ways, `--nanChecks:on` against a routine's `push nanChecks: on`, c and cpp), and a float `/=` is now lowered (it declined); pins `tsymex_0016_floatchecks`, `tsymex_rfc0005_s8cu_cl_float`. Nil checks: not applicable. Nim 2.2.10 has no `nilChecks` option: `--nilChecks:on` and `off` generate identical C, both SIGSEGV on a nil dereference, `{.push nilChecks: off.}` changes nothing (`check_options.nim`); `crashRaise` treats a nil dereference as an uncatchable crash in every build, `-d:danger` included; regression pin in `tsymex_0016_floatchecks`. `-d:danger` (PRC-08): every option reads off through the build profile and `check_options`; one pin per kind in `tsymex_0016_danger`. `math.ceilDiv` (PRC-09): lowered by name, exact inside its precondition, a path outside it declines (its asserts follow the first instantiation's options). Ref variants: the union image and its mask live in the heap (`<id>__@img`, `<id>__@msk`), pinned in `tsymex_0016_fieldref`."
source = "S8cu"
evidence = "S8cu's fail-closed decline (`feCheckOption`, `feOverflowCheckOption`) closed a false `sxRaised`. (2026-11-07, W1-z): a `--rangeChecks:off` build declines every routine `feCheckOption`"
cells = []
pins = ["tsymex_0016_rangeoff", "tsymex_0016_fieldrangeoff", "tsymex_0016_boundoff", "tsymex_0016_fieldoff", "tsymex_0016_objoff", "tsymex_0016_floatchecks_nan", "tsymex_0016_floatchecks_inf", "tsymex_0016_floatchecks_caught", "tsymex_0016_checksoff"]

