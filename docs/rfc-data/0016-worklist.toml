state = "closed"
note = ": S8ck-r nelli half done 2026-11-17 (rfc-0016-w4s8ckr): LeakSanitizer is on in the ASan leg (`detect_leaks=1`, `tests/asan/lsan.supp`, a fourth self-test plant `tests/asan/plant_nim_leak.nim`). nelli's leaks are fixed at the root, not suppressed: A, a first write compiled to a bitwise copy in `pcre_select.normalize` (an initializer; `tsymex_0016_s8ckr_firstwrite_audit` keeps the shape out of src/); B, a never-read string cursor in `tsymex_rfc0005_s8ca_strings` (the test reads `s`); D, threadvars never destroyed at thread exit (`releaseSymexThreadState`, `src/nelli/thread_state.nim`: armed at a Nim thread's exit, called by a foreign thread's owner; `tsymex_0016_s8ckr_threadstate_audit`). C (item 2) stays suppressed as `leak:context::newContext` until the milpa.lock bump to the nim-z3 commit that closes item 2. Upstream Nim 2.2.10 bugs, stock and patched, for a report decision: A `tests/asan/nim_firstwrite_leak.nim` (sempass2 `nfFirstWrite` after a nested write), B `tests/asan/nim_cursor_strlit_leak.nim` (cursor inference on a written, never-read `var s = \"ab\"`); threadvars are not destroyed at thread exit, `tests/asan/nim_threadvar_exit_leak.nim`. S8ck-r lock bump 2026-11-17: milpa.lock at nim-z3 d86efda (items 2, 3, 4 version half, 8 to 12 there); `leak:context::newContext` removed, `tests/asan/lsan.supp` has no entries. Under LeakSanitizer (stock libz3) the context leak is gone; clean: s8cf_classes, s8ca_strings, S6b_regex, CR1_CR5_closure_heap, h_stepC_heapidentity, s8ca_closures_heap (nelli builds no datatype sorts, so the constructor fix is unreachable here). Still RED: s8ckr_threadstate (80 B) and s8cb_replay (40 B): d86efda's own thread-exit hook (nim-z3 16eb6e2, `setSlot` -> `onThreadDestruction`) never leaves Nim's handler list, so the list payload (a never-destroyed threadvar) leaks per thread; nelli's disarm frees it only when its own entry was the last. Fix belongs in nim-z3 (remove its hook at exit and on `setCurrentContext(nil)`, free the list