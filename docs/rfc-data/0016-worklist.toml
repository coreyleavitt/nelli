title = "Found by K8b's read-only and typeop axis suites (INT-56): a `Table` built by `toTable` over a literal of pairs declines. `let x = {t: u}.toTable; x[t] == 7` (sat at `b = 7`) returns an untrusted `sxUnknown` with `feUnsupportedStmtKind` (\"for-loop over `items` with 2 loop variable(s)\"), while the same table built by `initTable` and `[]=` is exact"
class = "precision"
state = "closed"
note = "`tables.toTable`'s body is `for key, val in items(pairs)`: a multi-variable `items` loop over an `openArray` of tuples, which the items/pairs arm declined (it lowered only `for x in c` and `for i, x in pairs(c)`). Walker 422 (417->422; 418-421 reserved for other W4 work): over a seq or an array whose element is a tuple of as many fields as there are variables, each element is bound to a fresh name and each variable to its field (`mkField`); each variable is checked by `lentLoopDecline` as a single one is, so a body that may write the container while a variable is read still declines. Pinned by `tests/tsymex_0016_int64_totable.nim`: the `initTable` control, `{t: u}.toTable[t] == 7` (sat, exact on typeop `letCursor/table`), an unsat target over a two-entry `toTable` table (exact), and the loop form directly over a seq and an array of tuples (sat, trusted); red at 7746d32a. The K8b fragments that avoided `toTable` (both `viewwhole` read-only rows and typeop `letCursor/table`) keep `initTable` and `[]=`: they are exact either way. Not yet probed: a `for (a, b) in items(c)` var-tuple form and a tuple element holding a seq or a string."
