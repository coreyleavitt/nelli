id = "INT-62"
table = "5.8c"
title = "Found by K8b's axis suites (INT-56): the solve cost of a program that sums several exact rows' values grows far faster than the rows' own costs. Six type x memory-op rows (`letCursor` over `bool`, `seq`, `set`; `fieldDefault` over `array`, `seq`, `variant`), each exact alone in under 1 s, packed into one accumulator took 359 s on c, and the same program wrapped in a template ran past 550 s (killed). Six type-class rows took 99 s packed; six stdlib rows (no `round`, `floor` or `trunc`) 14-81 s, each alone at most 5.5 s."
class = "performance"
state = "open"
note = "Each program is the K8b axis shape (`shAxis`: each row's fragment adds an `int` to one accumulator, the target compares it to a literal), seed 20261117 at `per` = 6. Not a hang that the pin settings can bound: the only bound is the wall clock, which they turn off. The axis suites avoid it by running one row per program (`per` = 1, INT-56 item 10), so no suite is red on it and nothing is blocked; it is the cost the packed shape exposed, and a reason the stream cannot pack rows until it closes. Not yet probed: which pairs of rows carry the growth, and whether the query or the walk (path count over the fragments' branches) is where the time goes."
