[[row]]
id = "INT-70"
table = "5.8c"
title = "Found by K8b's pragma axis suite (INT-56): a type section in a template a routine declares stops the compile. `template w() = (type O = object ...)` inside the SUT, with any type pragma or none (and a proc type, and a generic object), fails the build with \"node has no type\" (`dsl_typebridge.viewTypeImpl`, from `routeType`); `pragma_e`'s `twTemplate` relation wrapped the then-local `type/dynlib` and `type/nosinks` fragments in one"
class = "robustness (a compile crash of user code)"
state = "closed"
note = "The template's body is not semchecked where it is defined, so the type symbol its section declares has no type; the route scan (`routeScan`'s `nskType` and `nnkBracketExpr` arms) handed it to `routeType`, whose `getTypeImpl` is a hard compile error. Each fragment alone only declined (a type section in a routine is `feUnsupportedStmtKind`, unchanged); the pragma was never the trigger. Walker 423: both arms skip a type node with no type, as the `nskVar` arm's K8A-1 binding does (the expanded copy of the body, where the template is called, declares the typed symbol and is scanned), and `routeType` treats an untyped symbol or instance as unlisted instead of reading it. `routeType` was the only unguarded `getTypeImpl` the scan reaches from a template body; `routeRecFields` reads typed impls only. Pinned by `tests/tsymex_0016_int70_templatetype.nim`: an object type with no pragma and with a custom one, a proc type and a generic object in a template each compile and decline cleanly, and the K8b fragments' top-level types read in a template are exact (`type/dynlib`, `type/nosinks`); red (the file does not compile) at 2206eb51."
