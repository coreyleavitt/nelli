[[row]]
id = "PRC-32"
table = "5.2m"
state = "open"
note = "precision only: every outcome was `zsSat` in every regime"
home = "S8cj item 1"
source = "`docs/rfc/0016-research/S8cj.md` (\"The mechanism\", \"Conclusions\"); `s8cj/hist-*.log`"
moves = "a fresh thread's spend on a query follows what earlier threads ran (72,124 to 5,854,994 units on Z3 5.1). **Mechanism found (S8cj, 2026-11-07):** the input is Z3's process-wide allocation count (`Z3_get_estimated_alloc_size`), read by the default solver's tactic strategy as the `memory` probe: the QF_NIA portfolio's `cofactor_term_ite` preamble step runs only under 20 MB and its `nla2bv` + SAT stage only under 100 MB (`qfnia_tactic.cpp`), above which the smt core searches instead (72,053 → 876,223 in Z3's term order, 72,124 → 5,854,994 in the own-context order; 26,622 → 23,883 and 26,693 → 911,591 on 4.13.4). Deterministic and reversible (freeing the contexts restores the figures); not threads, addresses, malloc arenas or mmap thresholds. What grew the count was each exited thread's last `newContext()` left in nim-z3's current-context threadvar (17 MB per thread), and in a run `resetSymexRunState` leaving the walk context current after the run: fixed in `runSymex` / `runConcolicCollectImpl` (restore the previous current context), pinned by `tsymex_0016_s8cj_runctx`. The \"function of the query alone\" claims (S8bm, S8bp, `queryTermOrder`, `ownContextSolver`, `concreteScratchCheck`, the `s8by_remainder` header) now read \"the query and the process's Z3 memory\". Design alternative not taken: an explicit-tactic solver (`smt` / `Z3_mk_simple_solver`) would make spend memory-independent at the price of the portfolio's bit-blasting stage (72k against 876k-5.85M on factoring) and a walker version bump. The portfolio also has wall-clock `try_for` stages (2 s, 3 s), a third process-external axis on budget precision."
cells = []

