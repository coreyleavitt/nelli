[[row]]
id = "INT-76"
table = "5.8c"
title = "Found by INT-65's zero-value follow-up: a `c_longdouble` local faults the walker. `var x: c_longdouble; if x == 0.0: symexTarget(\"h\")` returns `sxUnknown` with `weInternalWalkerFault` (`eqBV`: `a.kind == b.kind`), and so do `!=`, `<` (`cmpBV`, width mismatch), `c_longdouble(k) == 3.0` and a field of the type (`FieldDefect`); an initialised local (`var x: c_longdouble = 1.5; x + 2.0 > 3.0`) is walked as an IEEE double and returns a trusted `sxSat`, an answer it gives whatever the C target's `long double` is"
class = "robustness (an internal walker fault), and a trusted answer on a target-dependent type"
state = "closed"
note = "The type classifies as the `__unsupported:c_longdouble` placeholder (K2c STY-06, the refused `float128` type-class row), which a parameter declines (`feUnsupportedParamType`), but a local's uninitialised declaration only tainted the path and bound nothing, so a later read met a float literal in the BV comparison arms; an initialised local bound the float64 value its initialiser computed, and an expression of the type was lowered as `float64` (its compiler alias). Not caused by INT-65: f89fb0c7 (INT-65's parent) faults identically on every shape and gives the same trusted `sxSat`. Native (Nim 2.2.10, gcc x86-64, c and cpp): C's `sizeof(long double)` is 16 where Nim's `sizeof(c_longdouble)` is 8; Nim's arithmetic casts each operand to `double` (`(NF)(x) + (NF)(0.2)`), so a sum is a double's, but a conversion stores the C value: `c_longdouble(k) == 9007199254740992.0` is false at `k = 2^53 + 1` (exact in the x87 64-bit mantissa), where a `float64`, and MSVC's `long double`, rounds to 2^53 and it holds. The value is the target's, and the float layer has no target-parametrised model, so the type declines rather than being walked as `float64`. CLOSED (2026-11-18, walker 435): every site that makes a `c_longdouble` value declines `feUnsupportedParamType`, the parameter site's kind, with a halting marker (`declineLongDouble`; `isUnsupported.unHalt`, `walkUnsupported` halts): a declared local, initialised or not (`isLongDoubleTyped` on the name, before any lowering), and any expression of the type (`parseExpr`: a conversion, a field read, arithmetic, a literal of the type). A halted path binds nothing, so no read meets a value of another sort; an object with a field of the type has no zero and declines with the same kind; a decline on no feasible path is not reached (a hint). `float` and `float32` locals are unchanged. Pinned by `tests/tsymex_0016_int76_longdouble.nim` (the reproducer, `!=`, `<`, arithmetic, the 2^53 + 1 conversion, a conversion, a field read and write, an unread local, an object used through its other field: `pinDecline` on `typeclass:float128`; an infeasible local and `float`/`float32` locals with literals: `pinExact`; the walker-435 floor); red at a604b3c2."
slice = "K8b"
source = "RFC-0016 INT-65 follow-up (zero values), 2026-11-18"
