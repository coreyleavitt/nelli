[[row]]
id = "INT-59"
table = "5.8c"
title = "Found by K8b's stdlib axis suite (INT-56): floating-point rows are slow to solve and no step bound covers them. `int(trunc(float(t) / 3.0))` alone is exact in 52-62 s on c; under a 15 s wall bound its target query reports `Z3 stopped advancing its step count`. The packed program `sqrt, round, signbit, -%, isNaN, +%` is exact in 83 s, and its extract-to-proc twin ran past 250 s."
class = "performance"
state = "open"
note = "Classified as an expected cost (FP division and rounding bit-blast), not a hang: each terminates at the pin settings. But the only bound on it is the wall clock, which the pin settings turn off, and the engine has no per-row solve budget to apply, so a suite cannot cap one row. Options: a per-row budget in `ResourceBudget`, or keeping FP rows one per program (`per` = 1) in the axis stream."
