[[row]]
id = "INT-28"
table = "5.8c"
title = "Replay child lifecycle and limits: SUT-started grandchildren survive when the child ends by itself; no memory cap on macOS/BSD and no CPU/FSIZE/NPROC limits or Windows `ActiveProcessLimit`; `pipe2`, the `PDEATHSIG` thread, `WaitForSingleObject` wrap, `resumeThread`, wire length overflow, \"(deleted)\" exe, non-atomic counter; ~~`waitpid(-1)` elsewhere~~ (only `waitpid(pid, …)` at `:480,1115,1140`) and no `setpgid` off Linux"
class = "crash (hardening); not compared against `main`"
state = "closed"
note = ": fixed (slice `rv0005-lows`, branch `rfc-0016-w4rvlows-a`). An ended child is left unwaited (`waitid` with `WNOWAIT`) until its group is killed, so what the SUT started dies however the child ends, on the fork and the POSIX re-exec paths alike (RED: `crash` on fork, all three endings on re-exec); `setpgid` and the group kill on every POSIX system; Windows already killed its job, now with `ActiveProcessLimit`. Limits: memory relative to the mapped address space by a portable probe (`memoryInUse`; macOS enforces none), CPU (`cpuBound`), file size (`replayFileSizeLimit`), and on Linux processes (`processBound`); `SIGXCPU`/`SIGXFSZ` read as `reTimedOut`, not a crash (RED: signalled). `pipe2` where it exists, `PDEATHSIG` checked against the host's pid after `prctl` and set on the re-exec child too (RED: the re-exec child outlived a killed host), `ResumeThread` checked, the re-exec target `/proc/self/exe` on Linux (RED: a deleted program could not replay), the replay count atomic. Already fixed by `c2e7751f`: the `WaitForSingleObject` bound (slices) and the `r.pos + n` wire overflow; `getLen` now also range-checks on a 32-bit target. Not observable here, so code only: the `pipe2` race, the `PDEATHSIG` race, `ResumeThread` failure, the counter race (its test passes on both sides). Windows evidence: the `symex-mingw` run of the pins"
source = "0005 review R1-24, R1-31, R1-32, R2-25, R2-27"
cells = ["construct:replay/child/lifecycle", "construct:replay/child/limits"]
pins = ["tsymex_0016_int28_child", "tsymex_0016_int28_child_reexec"]

[[row]]
id = "INT-29"
table = "5.8c"
title = "Replay child start-up robustness: a POSIX re-exec `execve` failure does `_exit(127)` and reads as a SUT crash; a child that cannot open its out file writes to nil and segfaults; the Windows private dir inherits the parent's ACL; the re-exec child inherits non-CLOEXEC fds; with fd 0-2 closed in the host the report fd is clobbered"
class = "crash (hardening); not compared against `main`"
state = "closed"
note = ": fixed (slice `rv0005-lows`, branch `rfc-0016-w4rvlows-a`). A re-executed child takes its witness (removes `in`) only once its report is open; the host reads an empty report beside an untaken witness as no run (`reRefused`, run-dependent), which covers a failed `execve` (RED: exit 127, a crash) and a report the child cannot open (RED: signal 11 from a write to nil). The Windows private directory is created with a protected DACL naming the user alone (`replayPrivateDir`; pinned through `icacls` on Windows, mode 0700 on POSIX). The re-exec child closes every fd from 3 before `execve` (`close_range`; RED: a non-CLOEXEC fd reached it). The report pipe is moved above fd 2 (RED: a host with fd 0-2 closed read `exited 0`)"
source = "0005 review R2-21 to R2-24, R2-26"
cells = ["construct:replay/child/startup"]
pins = ["tsymex_0016_int28_child", "tsymex_0016_int28_child_reexec"]

[[row]]
id = "INT-30"
table = "5.8c"
title = "The wire reader accepts a zero-size seq, amplifies allocation and does not bound recursion depth; unverified: the Windows fiber stack under refc"
class = "crash (hardening); the fiber half is unverified"
state = "closed"
note = ": fixed (slice `rv0005-lows`, branch `rfc-0016-w4rvlows-a`). An element that takes no bytes is written with a pad byte, so every seq count is backed by its bytes (RED: a crafted count read the next value's bytes, and a real seq of empty objects at the end was refused); elements are added as read, never allocated ahead (RED: 4 KiB per claimed element); `wireDepthLimit` bounds nesting at both ends with `WireError` (RED: the writer overran the call depth). The Windows fiber under refc was not run here: by construction a tracing collector scans from the fiber's stack to the thread's recorded bottom, so the SUT now runs on a fiber only under ARC/ORC (`fiberSafe`); `tsymex_0016_int30_refcfiber` (`--mm:refc`) runs the fiber path on Windows, whose evidence is the `symex-mingw` run of this branch; no RED was observed for it"
source = "0005 review R2-28, R2-29"
cells = ["construct:replay/wire/codec"]
pins = ["tsymex_0016_int30_wire", "tsymex_0016_int30_refcfiber"]

[[row]]
id = "INT-31"
table = "5.8c"
title = "Cache-key coverage: `--opt`, `--cc`, `--cpu` and `--os` are not in the `\\|bf=` segment; a `{.push.}` inside `fn` itself is invisible to it (covered by the `feCheckOption` decline, worth a test) Includes W-18: the `;impl=` digest holes (importc/dynlib bodies, override callees, proc-value targets, `lib/`; `docs/migration/0.9.1.md:264-273`). The `\\|bf=` half is closed by K5a."
class = "soundness (key coverage); not compared against `main`"
state = "closed"
note = ": fixed (slice `rv0005-lows`). Part 2 (branch `rfc-0016-w4rvlows-b`, walker 406): the `importc` body hole is fixed: a program reaching a body the key cannot see (`implOpen`: a foreign body, a proc variable's target) stores no replay-settled claim (RED: a lossy witness confirmed against one C body was served, as safe, to a SUT whose C body exits). Pinned without a change: a `let` proc value's routine and an override's callees are keyed; the walk declines a call through a `var` proc value and a method whose overrides cannot be listed, so no claim is made; a push inside `fn` makes no stale claim (`tsymex_0016_int31_keyholes`). Part 3 (branch `rfc-0016-w4rvlows-b2`, walker 407): the `lib/` hole is fixed: the key carries `|tc=`, a SHA-256 of every file under the build's `lib/` and of the compiler binary, computed at compile time by a helper the running compiler builds once into the nimcache (`toolchain_id`, `toolchain_hash`); a build that cannot run it warns and keys its claims to itself alone (RED: a build under a toolchain copy whose `math.ceilDiv` differs, same `NimVersion`, was served the other copy's witness from the cache, and that witness misses the label natively; `tsymex_0016_int31_libkey`)"
source = "0005 review R2-16, R2-20, R3-16"
cells = ["construct:cache/key/impl", "construct:cache/key/toolchain"]
pins = ["tsymex_0016_int31_keyholes", "tsymex_0016_int31_libkey"]

[[row]]
id = "INT-32"
table = "5.8c"
title = "Replay and settle policy: ~~stale \"trusted by construction\" comment, unenforced one-digit codec~~ (fixed: `3476f039`), `storedGaps` prefix, `reSignalled` not run-dependent, first-soundness-per-type, lossy sibling precision; `witnessUnsafe` not rendered, `spinJitter` costing up to about 100 syscalls per op, ~~the `ReplayOutcome` doc saying \"three-valued\"~~ (fixed: `3476f039`); an always-hanging witness is cacheable and pays `replayTimeoutMs` every run, and a loser's timeout blocks the winner; a statically refused replay stored `rsUnconfirmed` and runnable on a hit (documented policy, to be revisited)"
class = "performance and precision; no wrong verdict described"
state = "closed"
note = ": slice `rv0005-lows`. Part 3 (branch `rfc-0016-w4rvlows-c`, walker 406->408), `tsymex_0016_int32_settle`, `tparallel_int32_jitter`: gaps metadata present but malformed is a miss of the whole record (RED: the prefix was served); a child ended by a signal from outside the SUT is run-dependent, a fault or abort is not (`signalledFromOutside`; RED: a SIGTERM verdict was stored); `saveSymexRaisedImpl` keeps the strongest finding per type (`claimRank`: trusted, then host-runnable) with its own gaps and witness (RED: the first); a clean winner is lossy by its own extraction only (`RawResult.witnessExtraction`; RED: a sibling's `feExtractionFailed`); `witnessUnsafe` was already rendered by every format (`50ebce5b`), now pinned; jitter makes at most one yield per op, the rest CPU pauses (RED: 4608 yields over 150 ops, 3.11 ms; now 123, 2.34 ms); a child killed at `replayTimeoutMs` is no longer run-dependent, the bound being keyed, so the verdict is stored and a hit does not replay (RED: replayed every run; this reverses WA-7's timeout arm and SC1's for a kill at the bound: a confirmed claim is stored `witnessUnsafe`, failing closed); a lossy winner whose replay no child ran is the new `rsRefused`, not trusted and not host-runnable, stored only when the refusal is the build's (RED: `rsUnconfirmed`, runnable). Item 7 policy: storing a verdict killed at the bound, with a confirmed claim stored `witnessUnsafe` (failing closed), supersedes WA-7's timeout arm, SC1 and R5 D4b. Part 4 (branch `rfc-0016-w4rvlows-c`, walker 408 unchanged: no outcome moves), item 8: candidate replays run at once (`replayInOrder`, `replayresult.nim`, the one primitive the runtime's replay pass and `run_replayed` share; children are `PendingChild`, started then stepped, `replayproc.nim`, fork and both re-exec paths), at most `SymexSettings.replayConcurrency` (default 4, verdict-neutral, not keyed); the winner is the first in order that confirms once every earlier one has missed, no earlier running one is given up on, and later ones are stopped (RED: two hanging candidates before a confirming one took 4560 ms at a 2000 ms bound; GREEN under 4000 ms; a hanging later candidate is killed). Gate: `tsymex_0016_int32_settle` green on the fork path and under `-d:nelliReplayReexec`, the replay suites and audits green; fixed, pending the Windows legs on the push"
source = "0005 review R1-33, R1-34, R4-07, R4-10"
cells = ["construct:cache/record/gaps", "construct:replay/settle/policy"]
