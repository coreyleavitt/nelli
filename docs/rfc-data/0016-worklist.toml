[[row]]
id = "INT-71"
table = "5.8c"
title = "Found by INT-62: a `seq` local declared by a template inside the walked routine (`var x {.gensym.}: seq[int] = @[t, u]; acc = acc + x[0]`), in a module that imports `z3`, declines every read with `feGlobalRouteUnproved` and returns an untrusted `sxUnknown`. The same body written inline, or the template over a `string` local, is exact; INT-62's rows moved to a module of their own (`tests/int62_rows.nim`) are exact."
class = "precision"
state = "open"
note = "The route scan of the template-expanded routine reaches the `z3` library's module-level state (`currentZ3Ctx`, softlink's function pointers) and probes its owning types' lifetime hooks; one `=destroy` holds a `while` loop and cannot be summarised, so `routeAnyValue` is opened and a read of any variable (a parameter included) declines. Which node of the template's expansion leads the scan into `z3` is not yet pinned down. Reproducer `tests/tsymex_0016_int71_gensymseqroute.nim` is red and unregistered (a pin must be registered)."
slice = "K8b"
source = "RFC-0016 INT-62 (rfc-0016-w4perf), 2026-11-18"
cells = []
pins = []
