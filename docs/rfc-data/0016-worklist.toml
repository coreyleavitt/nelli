[[row]]
id = "INT-61"
table = "5.8c"
title = "Found by K8b's magic axis suite (INT-56): the length of a string built from a char is slow to solve. `len($chr(t + 128))` (magic `CharToStr`) alone is exact in 84-95 s on c, and `var s = \"ab\"; s.add chr(t + 128); s.len` (magic `AppendStrCh`) in 106-114 s, each under the original and its relation, against about 1 s for the other magic rows."
class = "performance"
state = "closed"
note = "Classified as a cost, not a hang: each terminates at the pin settings (`per` = 1, `-d:k8aTrace`). The row's own pin (`$c == \"x\"`) is fast, so the cost is the length of the char's string beside the accumulator's arithmetic, near INT-57's stall on `str.from_int` but on a different operation. No step bound covers it (the pin settings turn the wall clock off). The axis stream blocks `magic:CharToStr` and `magic:AppendStrCh` against this row until it closes. Closed (2026-11-18, walker 421). Root cause: the `int` addition's overflow side over `len($chr(t + 128))` asks whether `str.len(str.from_code(k))` leaves the `int` range, and Z3's sequence solver did not refute that in 12.4M units. Fix: each `str.len(x)` whose argument has a bound its structure gives (a literal, `str.from_code`, `str.at`, a concatenation of bounded parts, `str.substr`, an `ite` of bounded arms) gets `str.len(x) <= n` beside the query (`seqLenBoundFacts`), a theorem of the sequence theory, so the arithmetic refutes the side at once. `tests/tsymex_0016_int61_strlenbound.nim`: (1) every fact kind valid (its negation UNSAT with every argument free); (2) an unbounded part gets none; (3) `CharToStr` walks in 34,206 units and `AppendStrCh` in 36,423, each under 250k (84-114 s before); (4) the floor. Both are readmitted to the magic axis stream."
