# RFC-0016 work list (section 8.2): the source of truth for section 5 and section 5.9.
#
# The tables in docs/rfc/0016-native-parity-hardening.md between the
# "worklist:begin" and "worklist:end" markers are RENDERED from this file by
# scripts/render_worklist.nim; edit here, then run
#   scripts/dt.sh nim c -r scripts/render_worklist.nim write
# `check` fails when the RFC differs from the render (the staleness check,
# CI's `pins` job). tests/tsymex_0016_universe.nim (tests/rfc0016_ids.nim) reads this file with a flat
# reader (arrays of tables; string and string-array fields only).
#
# Fields of a [[row]]: id, table (the [[table]] it renders in), title, class,
# state (open | closed | merged | moved | never | owned:RFC-NNNN), note (the
# rest of the status cell after the vocabulary word; an open row's note is the
# whole cell), slice (the RFC-0016 slice that owns it, "" when none is named),
# home / source / evidence / cause / moves / why (the table's other columns,
# verbatim), cells (rendered CellKeys, validated by parsing back), pins
# (registered test files), aliases (other ids that name the same finding),
# sha (the fix, where the ledger gives one), never_reason.
#
# K1a-ids decisions (coordinator, 2026-11-08):
#  1. PRC-36 and PRC-37 were each defined twice. The section 5.2 precision-table
#     rows keep the ids (SND-01 and SND-07 point at them). The moved-slices
#     rows (W1-b cursor, W1-e float width) are renumbered PRC-39 and PRC-40.
#     CHANGELOG.md and the handoff's references to them are re-pointed.
#  2. A status outside the vocabulary maps to its intent and the original text
#     stays in `note`; the rendered cell begins with the vocabulary word.
#     closed: CI-03 (fixed), MOV-01 (done, W1-z), UPS-01 and UPS-03 (filed; the
#     URL is the evidence). open: UPS-02 (held, D-0016-3), PRC-32 (a finding
#     note, not a disposition). never: AUD-01, AUD-09, AUD-11 (the K1a-test
#     `never` cell is their evidence form). moved: INT-28..INT-38 to slice
#     rv0005-lows. open, slice K8c: CRH-07 (the walker-under-sanitizers job).
#     W-12: open, slice K3b: its decline half is done (W1-f found the walker
#     already agrees with native), but the Home cell still names K3b for the
#     exact half, so the row stays open for K3b.
#  3. F-0001..F-0007 are the same findings as W-01..W-07: the W rows are
#     closed with the ledger's sha and carry aliases = ["F-000N"]. They are not
#     separate rows. The section 5.0 table gains a State column to show it.
#  4. Every table has a [[table]] section (name = marker id, ordered header
#     texts and the row field each column shows) so all 16 layouts round-trip.
#  5. The file lives in docs/rfc-data/, not docs/rfc/: quipu presumes every
#     docs/rfc/**/*.toml is a legacy ledger (its toml glob is the record glob
#     with .md swapped for .toml, and git's `*` crosses directories), so the
#     quipu pre-commit gate rejects a data file there. RFC-0016 8.2 now names
#     this path.
# Also found while extracting: CI-03, UPS-02 and PND-10 each had an unescaped
# "|" inside the Evidence cell, which made a sixth cell that markdown renderers
# drop (their Owner status was never shown). The pipe is now escaped and the
# status is the last column.

