[[row]]
id = "INT-32"
table = "5.8c"
title = "Replay and settle policy: ~~stale \"trusted by construction\" comment, unenforced one-digit codec~~ (fixed: `3476f039`), `storedGaps` prefix, `reSignalled` not run-dependent, first-soundness-per-type, lossy sibling precision; `witnessUnsafe` not rendered, `spinJitter` costing up to about 100 syscalls per op, ~~the `ReplayOutcome` doc saying \"three-valued\"~~ (fixed: `3476f039`); an always-hanging witness is cacheable and pays `replayTimeoutMs` every run, and a loser's timeout blocks the winner; a statically refused replay stored `rsUnconfirmed` and runnable on a hit (documented policy, to be revisited)"
class = "performance and precision; no wrong verdict described"
state = "closed"
note = ": slice `rv0005-lows`. Part 3 (branch `rfc-0016-w4rvlows-c`, walker 406->408), `tsymex_0016_int32_settle`, `tparallel_int32_jitter`: gaps metadata present but malformed is a miss of the whole record (RED: the prefix was served); a child ended by a signal from outside the SUT is run-dependent, a fault or abort is not (`signalledFromOutside`; RED: a SIGTERM verdict was stored); `saveSymexRaisedImpl` keeps the strongest finding per type (`claimRank`: trusted, then host-runnable) with its own gaps and witness (RED: the first); a clean winner is lossy by its own extraction only (`RawResult.witnessExtraction`; RED: a sibling's `feExtractionFailed`); `witnessUnsafe` was already rendered by every format (`50ebce5b`), now pinned; jitter makes at most one yield per op, the rest CPU pauses (RED: 4608 yields over 150 ops, 3.11 ms; now 123, 2.34 ms); a child killed at `replayTimeoutMs` is no longer run-dependent, the bound being keyed, so the verdict is stored and a hit does not replay (RED: replayed every run; this reverses WA-7's timeout arm and SC1's for a kill at the bound: a confirmed claim is stored `witnessUnsafe`, failing closed); a lossy winner whose replay no child ran is the new `rsRefused`, not trusted and not host-runnable, stored only when the refusal is the build's (RED: `rsUnconfirmed`, runnable). Item 7 policy: storing a verdict killed at the bound, with a confirmed claim stored `witnessUnsafe` (failing closed), supersedes WA-7's timeout arm, SC1 and R5 D4b. Part 4 (branch `rfc-0016-w4rvlows-c`, walker 408 unchanged: no outcome moves), item 8: candidate replays run at once (`replayInOrder`, `replayresult.nim`, the one primitive the runtime's replay pass and `run_replayed` share; children are `PendingChild`, started then stepped, `replayproc.nim`, fork and both re-exec paths), at most `SymexSettings.replayConcurrency` (default 4, verdict-neutral, not keyed); the winner is the first in order that confirms once every earlier one has missed, no earlier running one is given up on, and later ones are stopped (RED: two hanging candidates before a confirming one took 4560 ms at a 2000 ms bound; GREEN under 4000 ms; a hanging later candidate is killed). Gate: `tsymex_0016_int32_settle` green on the fork path and under `-d:nelliReplayReexec`, the replay suites and audits green; fixed, pending the Windows legs on the push"
source = "0005 review R1-33, R1-34, R4-07, R4-10"
