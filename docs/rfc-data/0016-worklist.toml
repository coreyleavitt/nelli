[[row]]
id = "INT-57"
table = "5.8c"
title = "Found by K8b's axis suites (INT-56): a query over `$n` (`iekIntToStr`, Z3 `str.from_int`) beside integer arithmetic or a set's `card` is one on which Z3 stops advancing its step counter, so `queryRLimit` and `walkRLimit` never end it. Under the pin settings (`queryTimeoutMs = 0`) the walk does not terminate: `len($t) + t + 129 <= 3` (the `OverflowDefect` query of the addition), `acc = acc + len($t)` (typeop `letCursor/string`), and `ord($t <= $u)` packed beside `card({a} + {b})` and an enum order (the target's own query, or `incomplete (theory seq)`). Each was killed at 900 s (typeclass program 0, magic program 0, typeop program 6). Under a 20 s wall bound each returns, with the stall named in its errors (`Z3 stopped advancing its step count`); the unsat shape is then `sxUnknown`."
class = "non-termination (solver step bound)"
state = "open"
note = "Breaks \"never hang, always classify\" on modelled exact rows (magic `IntToStr`, `LeStr`; typeclass `string`; typeop `letCursor/string`). Alone, `len($t) + t <= 3` is exact in about 9 s and `len($t) == 3 and t > 3` in 0.3 s, so the stall depends on the arithmetic around the length, not on `$` itself. A lower `queryRLimit` (5M) does not end it either. Not attempted: a theorem beside the query bounding `str.len(str.from_int(v))` by `v`'s digit count (the `bvIntInverseFacts` / `bitSetCardFacts` pattern), which may let Z3 decide the length arithmetic without the seq solver. Pinned red by `tests/tsymex_0016_int57_strlenstall.nim` (four checks, a 20 s wall bound, about 330 s), not registered while red. The `per` = 1 sweep (INT-56 item 10) found three more magic rows that never return alone, each a `len` over `$t` added to the accumulator: `LengthStr` (`len($t)`), `ConStrStr` (`len(\"ab\" & $t)`), `AppendStrStr` (`s.add $t; s.len`), each killed at 900 s. The axis stream blocks twelve rows against this row (`s0016_k8b_snippets.blockedRows`: magic `IntToStr`, `Int64ToStr`, `BoolToStr`, `EqStr`, `LeStr`, `LtStr`, `LengthStr`, `ConStrStr`, `AppendStrStr`; typeclass `string`; typeop `letCursor/string`, `fieldDefault/string`); closing this row fails `tsymex_0016_k8b_axes` until they are readmitted and the axis floor re-measured."
slice = "K8b"
source = "RFC-0016 K8b, the admission-axis suites (INT-56), seed 20261117"
cells = []
pins = []

[[row]]
id = "INT-58"
table = "5.8c"
title = "Found by K8b's stdlib axis suite (INT-56): `int(round(float(a) / 4.0)) == 103` and the same over `floor`, `a: int8`, are unsat (the rounding lies in [-32, 32]) but the walk ends the path at the conversion with `ubFloatToIntRange` and returns an untrusted `sxUnknown` in about 2 s. A reachable target over the same conversion (`<= 3`) is exact."
class = "precision"
state = "closed"
note = "Two modelled exact stdlib rows, `math.round` and `math.floor`. Not yet probed: whether a plain `int(float(a) / 4.0) == 103` declines the same way (the conversion's range query rather than the rounding). Pinned red by `tests/tsymex_0016_int58_roundunsat.nim`, not registered while red. Closed (2026-11-18, walker 417). Probed first: the plain conversion `int(float(a) / 4.0) == 103` was already exact (`sxUnsat`, trusted), so the conversion's range query was not the defect and an FP operand is not declined as such. Root cause: the out-of-range side is decided at the op by `decideUndefined` (as every undefined op is: provably unreachable is pruned, anything else halts through `haltUndefined`, which lists a reachable side as a finding), and that check ran under the pruning budget alone (`loopPruneRLimit`, 250k units). A rounding (`roundToIntegral`) bit-blasts past it, so the side came back `zsUnknown` and the path halted untrusted, whatever the target. Fix: a side the pruning budget leaves undecided is asked again under the target query's own budget (`queryRLimit`), so unsat continues exact, sat halts with the finding, and only a side that budget also leaves open declines; this holds for every undefined kind, not only the conversion. The axis stream readmits `math.round` and `math.floor` (stdlib floor 26 -> 28 of 29, measured on c). Pinned by `tests/tsymex_0016_int58_roundunsat.nim` (the plain conversion as a control, round, floor, the version floor)."
