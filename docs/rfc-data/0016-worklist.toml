pins = ["tsymex_0016_int58_roundunsat", "tsymex_0016_k8b_axes", "tsymex_0016_k8b_axes_stdlib"]

[[row]]
id = "INT-59"
table = "5.8c"
title = "Found by K8b's stdlib axis suite (INT-56): floating-point rows are slow to solve and no step bound covers them. `int(trunc(float(t) / 3.0))` alone is exact in 52-62 s on c; under a 15 s wall bound its target query reports `Z3 stopped advancing its step count`. The packed program `sqrt, round, signbit, -%, isNaN, +%` is exact in 83 s, and its extract-to-proc twin ran past 250 s."
class = "performance"
state = "closed"
note = "Classified as an expected cost (FP division and rounding bit-blast), not a hang: each terminates at the pin settings. But the only bound on it is the wall clock, which the pin settings turn off, and the engine has no per-row solve budget to apply, so a suite cannot cap one row. Options: a per-row budget in `ResourceBudget`, or keeping FP rows one per program (`per` = 1) in the axis stream. Closed (2026-11-18, walker 421). Root cause: the conversion's range side over a rounded FP division is decided by bit-blasting the division and the rounding, and no step bound below the pin settings' covers that; the per-row budget the note offered would only have cut it. Fix: a query a float interval argument refutes is asked as `false` (`fpIntervalRefutes`): each FP term's value is bounded by an interval computed in host doubles, each rounded bound widened one ulp outward (exact bounds are not widened), with the argument turned off on a host thread without gradual underflow and on a subnormal literal whose rational does not round-trip. Its soundness argument is the doc comment in `runtime.nim`. `tests/tsymex_0016_int59_fpinterval.nim`: (1a) 1000 random FP terms, every refuted root checked false at all 256 inputs by Z3's simplifier, 12 also UNSAT by the solver; (1b) one rounded operation compared with a literal 0-2 ulps from its value at an extreme input, which catches the mutant with the widening removed (`refuted, but true at v = 128: fp.leq(fp.add(RTN, to_fp(sext(v)), 1e-3), -127.99900000000001)`); (2) the edges; (3) the trunc row walks in 12.07M units against a budget of 15M (it ran 52-62 s before); (4) the floor. `math.trunc` is readmitted to the stdlib axis stream."
slice = "K8b"
source = "RFC-0016 K8b, the admission-axis suites (INT-56), seed 20261117"
cells = []
pins = ["tsymex_0016_int59_fpinterval", "tsymex_0016_k8b_axes", "tsymex_0016_k8b_axes_stdlib"]

[[row]]
id = "INT-60"
table = "5.8c"
title = "Found by K8b's magic axis suite (INT-56): `len` of an array (magic `LengthArray`, a modelled exact row) declines when its value is an arithmetic operand. `len([int(a), 2]) + int(a) == 6` (sat at `a = 4`) and `let arr = [t, int(b), 1]; arr.len + t == 3` each return an untrusted `sxUnknown`: the compiler magic `len` (`LengthArray`) has no symbolic model (`feUnsupportedOp`). The same `len` in a comparison (`len([int(a), 2]) == 2 and a == 4`) is exact, as is the row's pin (`tsymex_0016_k4a_dispatch` `sLenArr`)."
class = "precision"
state = "closed"
note = "The row's table entry claims exact at every site, but the walker admits `len` of an array only where the parser reaches its comparison arm; an operand position falls through to the unregistered-callee decline. Pinned red by `tests/tsymex_0016_int60_lenarrarith.nim` (a comparison control is green), not registered while red. The axis stream blocks `magic:LengthArray` against this row (`s0016_k8b_snippets.blockedRows`) until it closes. Closed (2026-11-18, walker 417). Root cause: the call-form `len` arm in `dsl_parser` reached a model only for a seq, table or set receiver, so `len` of an array fell through to callee registration and the magic's stub-body decline (`feUnsupportedOp`) wherever it was read. Fix: `len(a)` of an array value folds to its type's element count, beside the `low`/`high` fold; as Nim's code generator (`genArrayLen`, the constant `lengthOrd`), the argument is not evaluated. The axis stream readmits `magic:LengthArray` (magic floor 116 -> 117 of 141, measured on c). Pinned by `tests/tsymex_0016_int60_lenarrarith.nim` (the comparison control, a literal and a `let`-bound array, the version floor)."
slice = "K8b"
source = "RFC-0016 K8b, the admission-axis suites (INT-56), seed 20261117"
