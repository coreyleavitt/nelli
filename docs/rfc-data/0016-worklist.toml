[[row]]
id = "PRC-09"
table = "5.2b"
title = "S8cu: `math.nim`'s pushed regions now decline Mechanism: K4c `admitStdlibBody`."
state = "closed"
note = ": done (2026-11-09, K4c): every routine of `std/math`'s pushed `checks: off` region (math.nim:157-1116) has a row. Walked by body with the check-option delta: `isPowerOfTwo`, `nextPowerOfTwo`, `floorDiv`, `floorMod`, `euclDiv`, `euclMod`, `sgn` (the push's unchecked arithmetic is modelled; a zero divisor or `low(int) - 1` halts as undefined). Declined with a named reason: `ceilDiv` (unsigned conversions, range checks off: `feCheckOption`), `divmod` (an opaque tuple-returning generic: `feOpaqueCallUnmodelled`), and the float family, which is never walked by body (a float-first call is lowered by name): `sqrt`, `floor`, `ceil`, `trunc`, `round` (ties away from zero; was banker's), `signbit`, `isNaN`, `copySign`, `classify` are modelled, every libm function and composition, `frexp`, `splitDecimal`, `degToRad`, `radToDeg`, `almostEqual`, `mod` and `round(x, places)` decline `feUnsupportedOpAborted` naming the cell. Excluded: the JS-only and `windowsCC89`-only helpers of the region (`toBitsImpl`, `jsSetSign`, `truncImpl`, `log2Impl`, `jsRound`), which no build row compiles"
source = "S8cu"
