title = "Intake #178 (`[nightly] cpp:tsymex_rfc0005_s8cn_step1d`): a mis-filing, not a new failure. The suite is the INT-43 known-red of `tests/0016-allowlist/nightly-cpp-known-red.txt`, and every cpp gate since 2026-11-10 lists it under `known-red (allowlisted, still red; not failing)`. `scripts/rfc0016-intake.sh --extract` kept the FAIL block's title across that header, so on a night with any new cpp failure (#177's, from run 42804432874 on) the known-red test was filed and commented as `red tests NOT in the allowlist (new failures)`; on 2026-11-09, with no FAIL block, it was not. The red itself is INT-43: `grow_stale_dead` returns `sxUnknown` (`Z3: canceled` under `seqQueryRLimit = 20000000`) where the pin wants `sxUnsat`, `N45STATS queries=74 rlimit=745082924`. Reproduced 2026-11-17 with `scripts/dt-bounded.sh` on both backends (c and cpp: the same 74 queries and 745082924 units) in a dev image carrying the official Z3 5.1.0 archive (`rfc-0016-w4devimg` fd32c393), so INT-43 is the Z3 build, not the backend. Fixed: `a555923d` ends the FAIL block at any other unindented line (self-test case added, red before the fix); on run 44076804398's cpp gate output the extractor now yields only `tsymex_0016_k6b_hookcopy`"
