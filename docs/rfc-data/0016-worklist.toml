[[row]]
id = "INT-43"
table = "5.8c"
title = "Z3 5.1.0's official Linux release archive (the `symex-linux` host leg) consumes about 1.66 times the rlimit units the podman image's Z3 5.1.0 does on the same queries (`tsymex_rfc0005_s8cn_step1d`: `rlimit=740770840` host, `446158528` podman, 74 queries both), so a budget-sensitive verdict flips: `grow_stale_dead` returns `sxUnknown` (`Z3: canceled` under `seqQueryRLimit = 20000000`) where podman returns `sxUnsat`. Known-red in `tests/0016-allowlist/linux-host-known-red.txt` until the budget is set from a unit that does not depend on the Z3 build, or the leg uses the image's Z3. S8cj: the Z3 build is one of three process-external inputs to a unit count; the others are the process's Z3 memory (the default solver's strategy reads it at 20 / 100 / 300 MB thresholds, PRC-32) and wall clock (the strategies' `try_for` stages), so a budget-sensitive verdict can also flip between a small test process and a real run, or on a slow host. Not re-measured here; the 1.66x remains unexplained by S8cj's mechanism unless the host leg's process sits in another memory regime (the probe is `Z3_get_estimated_alloc_size` at the query)."
class = "precision (host-specific; the verdict is sound)"
state = "open"
note = ""
source = "CI-A3 baseline, run 42434778262; `docs/rfc/0016-research/S8cj.md` conclusion 5"
cells = []

