[[row]]
id = "INT-55"
table = "5.8c"
title = "Found by K8b's `faExnMemory` family: its 24-program gate batch (seed 20261117) stops the COMPILE with `Error: unhandled exception: No such file or directory [OSError]` raised in the compile-time VM, with no frame beyond `oserrors.nim(92) raiseOSError`. Programs 0..3 compile and are exact; programs 4..13 as one batch fail; program 6 (a macro-declared `ref object` field) alone compiles and is exact, so the trigger is a combination in one module, not one program. Not a verdict disagreement: no run reaches the walker"
class = "compile crash (walker, compile-time path)"
state = "closed"
note = ": fixed in K8b. A walker defect in a compile-time path, not in the generator: `scoped_names.markByRef` (RFC-0005 S8ba) gave a by-reference mark the base node's file (`setLineInfo(base.lineInfoObj.filename, ...)`), and the compile-time VM's `setFile` (`opcNSetLineInfoFile`) runs the name through `expandFilename`, whose OSError is native, escapes the VM and stops the compiler. A node `parseStmt` built has a pseudo path (no file on disk), so any macro-emitted routine passing a heap lvalue (a field, element or ref field) to a `var` formal crashed the compile; the family hit it through `twRoute` (every write routed through a `var` parameter), which the rotation gives programs 3, 7, 11, ... (program 3 is a `local`, no heap base, hence 0..3 compiling). Found by running the compiler under gdb with a breakpoint on `raiseOSError`: `rawExecute -> fileInfoIdx(RelativeFile) -> expandFilename`. The mark now carries `scoped_names.nim`'s own path (`byRefMarkFile`); only its line and column are ever read (`byRefName`), so verdicts and IR names are unchanged and the walker version stays. Pinned by `tsymex_0016_int55_parsedbyref` (an object field, a seq element and a ref-object field through a `var` formal in a parsed routine: sat, sat, exhaustive unsat), and the `faExnMemory` family is registered (`tsymex_0016_k8b_exnmemory_a`/`_b`, 24 programs, every run exact, pairwise 61/61)"
slice = "K8b"
source = "RFC-0016 K8b, `faExnMemory` generated programs"
cells = []
pins = ["tsymex_0016_int55_parsedbyref", "tsymex_0016_k8b_exnmemory_a", "tsymex_0016_k8b_exnmemory_b"]

[[row]]
id = "INT-56"
table = "5.8c"
title = "K8b's remainder and decisions. Shipped: the three test-side pin families (`faCallShape`, `faExnMemory`, `faGeneric`) through K8a-gen's generator, their metamorphic relations, the cells-exercised record K1 reads, and the pairwise figure with its floor. Open: fuzzer families for the admission axes other than construct (magic, typeclass, typeop, pragma, stdlib, build, readonly, defined), which iterate `cells(axis)` so that \"every exact row exercised on its build rows\" (section 12 item 4, first clause) is a figure; today only the construct axis has a family (K8a-gen's shapes)"
class = "test-harness"
state = "open"
note = "K8b decisions (section 10 left them open). (1) The pairwise figure is t = 2 coverage over each family's dimension values (`tests/s0016_k8b_pairs.nim` `famDims`), counted only from `exact` runs, so it measures combinations the walker is exact on; per family covered/total, floor in `tests/0016-pairwise.floor` with the universe size, a changed universe must be re-measured. (2) The cells-exercised record is a second record kind in the same `.jsonl` files as the pins (`kind = exercised`), so `universe-join.sh` carries it unchanged and `pinRecords` skips it. (3) K1 judges each family that has records on the leg's row against the floor; a leg that ran no family is not judged. (4) A family batch runs each program with one relation, rotating by id (`familyCases`), which keeps a suite near a minute per family on c; `genBatch` still runs every relation. (5) Programs come from a greedy pairwise cover (`coverChoices`, 48 seeded draws plus one built on the first uncovered pair). (6) The section 6 neighbours are relations: `twHoist` (evaluation order), `twRoute` (a write through a `var` alias); AUD-07 is `twUninst` plus the `uninst` dimension. (7) Each family runs as two suites (`familyFiles`: `tsymex_0016_k8b_<family>_a`/`_b`), consecutive slices of one seeded stream (`k8bFirst`), so each fits the per-test time ceiling (alone on c, cold cache: about a minute; the CI cpp figure is about twice that). The floor is judged by K1 on the UNION of a family's halves (`exercisedJoinProblems`): splitting a batch never lowers its figure, and a family with records from one half only fails naming the missing half (a partial run does not judge it). A half checks findings and exactness, not the floor. callshape's batch is 30 programs (55/55; 22 gave 52/55), exnmemory 24 (61/61), generic 26 (47/47). (8) INT-56 in progress (2026-11-17) on branch `wip/int56-axes` (2fc6b5b6), not merged and not registered here. Design: a fragment per exact row (`tests/s0016_k8b_snippets.nim`: Nim source over `a, b: int8` adding an `int` to an accumulator; 125 magic, 49 pragma, 29 stdlib, 36 typeclass, 28 typeop and 18 defined fragments, none for build or readonly); `genAxis` packs `per` rows per program (shape `shAxis`, seeded order, one rotating relation: twDead, twExtract, twTemplate, and twComm with the fragments reversed, withheld when a fragment raises); the denominator is the axis table's admitted rows (`s0016_k8b_axes.modelledRows`, read through `cells`) and the numerator is the rows named by `exact` cells-exercised records whose family is the axis, per build row; the floor `tests/0016-axis-rows.floor` is judged by K1 (`axisJoinProblems`) when all of an axis's suites (`axisFiles`) ran on the leg. Every fragment compiles under every relation (a probe compiled them all). First run on c (per = 6, three suites at once): the pragma batch was 16 exact, 2 declined (`feGlobalRouteUnproved`), with 0 disagreements and 45 pragma rows exercised. The stdlib batch in the same file and the magic batch (programs 0..10) each ran past the 900 s kill. The typeclass batch (programs 0..5) ended the process with no message (rc 1, likely a signal). None of the three is classified yet: isolate the program with -d:k8aDump and `per` = 1 before filing a row. Not started: build (proposal: the K5b cfg suites run a small generated batch and record `build:<cfgName>`, the checks-off suites likewise, and PCRE rows need regex programs) and readonly (its fragments need the K6 write shapes). (9) The first run's failures, classified (2026-11-17, `per` = 1 and per-run timing, `-d:k8aTrace`, which `emitCases` now emits: a `K8ATRACE` line before each run and a `K8ATIME` line with its time, outcome and first message line after). magic (programs 0..10 past 900 s): program 0, orig, never returns; every magic row alone (rows 0..32 of the stream) is exact; the hang is `ord($t <= $u)` packed beside a `card` and an enum order, an engine defect filed as INT-57. typeclass (rc 1 at 794 s): program 0, orig, never returns (a 900 s rerun was killed, rc 137, so the rc 1 is that same run ending some other way, not reproduced); it packs `len($t)` (row `string`) with five integer rows, INT-57 again. typeop, which the first run never reached: `letCursor/string` alone (`acc = acc + len($t)`) never returns, INT-57; the other 27 rows are exact alone. stdlib (past 900 s): no hang; FP rows are expensive and no step bound covers them (`math.trunc` alone 52-62 s, packed program 1 83 s orig and past 250 s extracted), INT-59; `math.round` declines `ubFloatToIntRange` on an unreachable target, INT-58. Harness defects, fixed here: `twComm` on a one-row program renders the same source (the self-test caught it at `per` = 1; `applicable` now withholds it); `math.toFloat64`'s fragment called `system.toFloat` (an int conversion, `feUnadmitted`) and `math.toFloat32`'s converted an int, so neither reached its row (both now change a float's width, `convertFloatWidth`); `cstring`'s fragment read the value (`len`, a conversion: `feUnsupportedOp`), where the row is the by-value formal site only (now the shape `tsymex_0016_k2c_typeclass` pins). With these, at `per` = 1: typeclass 72/72 exact, typeop 54/54 exact apart from `letCursor/string`, stdlib 54/58 exact (the four are INT-58's round and the old toFloat64 fragment). Remainder: the axis suites cannot pass while a packed program holds an INT-57 row (`IntToStr`, `Int64ToStr`, `BoolToStr`, `LeStr`/`LtStr`/`EqStr` beside arithmetic, typeclass `string`, typeop `letCursor/string`/`fieldDefault/string`); either the stream keeps those rows out of packed programs until INT-57 closes, or `per` drops; then time each suite alone on c, split or lower `per` under 75 s, measure the floor, register the suites. magic rows 33..124 and the defined axis were not run at `per` = 1. (10) Blocked rows, the sweep's end, and `per` = 1 (2026-11-18). BLOCKED ROWS: `s0016_k8b_snippets.blockedRows` names each row an open worklist defect breaks and that defect's row; `axisOrder` shuffles every fragment and then drops the blocked ones (blocking or readmitting one keeps the others' order), and each suite prints them as `k8b blocked (not exercised)`. A blocked row is never exercised, so the figure counts it against its axis like a row with no fragment. The list retires itself: `tsymex_0016_k8b_axes` (`s0016_k8b_axes.blockedProblems`, over the worklist) fails once an entry's row leaves `open`, naming the entry to delete and the floor to re-measure; an entry naming no worklist row or no fragment, or a row blocked twice, fails as a typo. Blocked (18): INT-57 magic `IntToStr`, `Int64ToStr`, `BoolToStr`, `EqStr`, `LeStr`, `LtStr`, `LengthStr`, `ConStrStr`, `AppendStrStr`, typeclass `string`, typeop `letCursor/string`, `fieldDefault/string`; INT-58 stdlib `math.round`, `math.floor`; INT-59 `math.trunc`; INT-60 magic `LengthArray`; INT-61 magic `CharToStr`, `AppendStrCh`. THE SWEEP (`per` = 1, `-d:k8aTrace`): magic rows 33..124 of item (9)'s order, each under its original and one relation: `LengthStr`, `ConStrStr` and `AppendStrStr` never return (INT-57's `len($t)` shape, killed at 900 s); `LengthArray` declines (INT-60, filed, red pin `tests/tsymex_0016_int60_lenarrarith.nim`); `CharToStr` 84-95 s and `AppendStrCh` 106-114 s (INT-61, filed); `DotDot` declined, a harness defect (its fragment used a slice as a value, which the row declines by design; the row is `..` in a for or slice head, now a for loop over `0 .. (t and 3)`, exact); the rest exact, about 0.4 s a run. defined: 18/18 exact. Alone per row, typeclass 35/35 (at most 1.4 s), typeop 26/26 (at most 1 s), stdlib 26/26 (at most 5.5 s). pragma `routine/base` declines `feGlobalRouteUnproved` on the dev image: a method call whose overrides cannot be listed without the patched compiler's dispatch table (`hasMethodTable`, PRC-02b), by design and not a row; it is exercised only on a build row whose toolchain has the table. Harness defect fixed: `-d:k8aTrace` emitted `epochTime` without `std/times` (`s0016_k8a_gen` now imports and exports it under the define). PER = 1: packing is what costs. At `per` = 6 with the blocked rows out, typeop program 2 took 359 s and its template twin ran past 550 s, typeclass program 1 99 s, the stdlib programs 14-81 s, rows that each solve alone in at most 5.5 s: filed as INT-62. Every axis suite now runs one row per program, so a suite's cost is its compile, and each axis's stream is cut into consecutive slices (`axisFiles`, 11 files): typeclass 2, typeop 1, pragma 2, stdlib 1, magic 4, defined 1. Alone on c on eos (idle, 8 cpus; `tsymex_0016_k8b_generic_a` 32 s there): typeclass_a 35 s, typeclass_b 37, typeop 40, pragma_a 39, pragma_b 38, stdlib 49, magic_a 47, magic_b 43, magic_c 44, magic_d 43, defined 37; every run exact apart from pragma_b's `routine/base` (2 runs declined), no disagreement. The workstation under load 20-30 measured the same files at 44-244 s (generic_a 112-129 s), so its figures are not the ceiling's. FLOOR (`tests/0016-axis-rows.floor`, linux-c, dev image): typeclass 35/37, typeop 26/33, pragma 50/153, magic 116/141, stdlib 26/29, defined 18/21, build 0/13, readonly 0/13 (271/440). The unexercised remainder is the blocked rows, `routine/base`, and rows with no fragment: typeclass `pointer`; typeop `table`, `multiVariant` (both sites) and `letCursor/uninterp`; pragma's 102 rows outside the fragment table (mostly inert routine and type pragmas); magic `SetLengthSeqUninit`, `Dup`, `Echo`, `Exit`, `TypeTrait`, `DeclaredInScope`, `CompileOptionArg`, `Slurp`, `StaticExec`, `RunnableExamples`, `InstantiationInfo`, `CompileDate`, `CompileTime`; defined `read/uninitialised`, `convert/floatToIntVia`, `call/opaqueBody`. REMAINING (INT-56 stays open): the build and readonly axes (no fragments; proposal in item 8), fragments for the rows above, and readmitting the blocked rows as INT-57..61 close (the self-test forces it)."
