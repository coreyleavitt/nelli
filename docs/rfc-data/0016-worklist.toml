[[row]]
id = "INT-66"
table = "5.8c"
title = "Found by K8b's pragma axis suite (INT-56): a routine the program declares with `{.magic.}` declines. `proc plus(x, y: int): int {.magic: \"AddI\".}` is `system.+` under another name, and `plus(t, u) == 5` (sat) returns an untrusted `sxUnknown` with `feUnsupportedOp` (\"the compiler magic `plus` ({.magic: \"AddI\".}) has no symbolic model\")"
class = "precision"
state = "closed"
note = "The walk models a magic where it meets the system routine's name (`binopForInfix` and the call arms dispatch on `+`, not on `implMagic`), so the magic axis's exact row `AddI` is never consulted for another name; the pragma row `routine/magic` (a `read` row: decided where the callee is resolved, `implMagic`) is reachable only through such a declaration. Red pin `tests/tsymex_0016_int66_usermagic.nim` (unregistered until green). Blocks pragma `routine/magic` in the axis stream (`s0016_k8b_snippets.blockedRows`). CLOSED (2026-11-18, walker 423): a call of a routine the program declares with a binary `{.magic.}` and no body is the infix of the system routine of the same magic and signature (`dsl_parser.userMagicRewrite`: the magic's operator from `userMagicInfix`, the system symbol found by `bindSym` and matched on `implMagic` and every formal's and the result's type, the infix typed as the call through a `borrowBaseViews` view), so the infix arm models it as it models `t + u`, overflow and narrowing included. A magic the infix arm does not model (a unary one, `AbsI`) or one no system routine of the same signature carries still declines `feUnsupportedOp`. Pinned by `tests/tsymex_0016_int66_usermagic.nim` (`AddI` sat and unsat, `LtI`, `int8` `MulI` sat and its `OverflowDefect`, the `AbsI` decline, the walker-423 floor); red at 2206eb51. The pragma row `routine/magic` is readmitted to the axis stream."
