[[row]]
id = "INT-63"
table = "5.8c"
title = "Found by K8b's typeop axis suite (INT-56): the modelled exact row `letCursor/uninterp` (a `let` copy of a placeholder-sort value: the handle is copied) declines on its simplest instance. `var x: pointer = nil; let c = x; acc = acc + t + 1` returns an untrusted `sxUnknown` with `feUnsupportedExprKind` (twice), and so does the same with `ord(c == nil)` read (four times), under the original and the template relation."
class = "precision"
state = "closed"
note = "The row's table entry (`typeaxes.letCursorShare`, `itUninterp`: `msValue`) claims the copy is exact, but no `pointer` local reaches the cursor rule: the walk declines the `pointer` value itself (likely the `nil` of a `pointer`, or the local's declaration), before the `let` is judged. Not yet probed: whether a `pointer` parameter, or a closure (`__closure`) local, reaches the row. The axis stream blocks `typeop:letCursor/uninterp` against this row (`s0016_k8b_snippets.blockedRows`) until it closes; closing it fails `tsymex_0016_k8b_axes` until the row is readmitted and the axis floor re-measured. CLOSED (2026-11-18, K8b): the row itself was never the cause. A `pointer` has no modelled value, so the `nil` that starts the local declines (`feUnsupportedExprKind`, \"nil literal of an unmodelled type\") before any `let`; that gap is INT-65. A closure local is the `__closure` placeholder sort, and `let c = f` over one reaches the row (`letCursorDecline` reads `holdsSharedMemory`, which admits `letCursor/uninterp`: `msValue`): a call through the copy is exact, sat and unsat (`tests/tsymex_0016_int63_closurelet.nim`, pinned on the row's cell). The axis fragment is now that shape (`let V_f = proc (x: int): int = x + t; let V_c = V_f; V_c(u)`), the row is readmitted to the typeop stream, and the typeop floor re-measured. No walker change."
