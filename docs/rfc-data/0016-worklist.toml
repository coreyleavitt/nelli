[[row]]
id = "INT-68"
table = "5.8c"
title = "Found by K8b's pragma axis suite (INT-56): the foreign-routine pragma rows cannot be exact. `importc` (C `abs`), `header` (C `llabs` with its header), `nodecl` (C `labs`) and `dynlib` (`abs` from the C library) each make the call the opaque-call arm (`isBodilessForeign`): a fresh result and a `feOpaqueCallUnmodelled` path taint, so every run declines"
class = "precision"
state = "closed"
note = "Sound by design (before S8b such a call walked an empty body and could answer a false `sxUnsat`), but the rows' table entries (`importc`, `dynlib`: `read`, decided by the opaque-call arm; `header`, `nodecl`: inert beside a foreign body) are reachable only through a foreign routine, so the axis cannot exercise them exactly. `header` and `nodecl` on a Nim-bodied routine do not compile (no prototype is emitted before the call). Exact needs a modelled foreign body, e.g. a summary table for the C library routines a program imports (`abs`, `labs`, `llabs`), consulted before the opaque-call arm. The own-suite cpp rows `routine/importcpp` and `type/importcpp` meet the same arm on the cpp leg. Blocks pragma `routine/importc`, `routine/header`, `routine/nodecl`, `routine/dynlib` in the axis stream. CLOSED (2026-11-18), by design: a foreign body is not visible to the walk, so the opaque-call arm (any result, the run carrying `ubTailUnverified`) is the correct model, and no exact value model exists in general (an `importc` binds a C name, not a body the walk can read). There is no narrower exact case: nelli models no C library routine (no `memcmp`/`strlen`/`abs` summary exists), and keying one on the C name would trust a binding the walk cannot see (a program may `importc` its own `abs`). A `never` record needs a `never` cell and the four pragma rows are admitted (`read`, decided by the opaque-call arm), so the row is closed on them instead: the axis differential judges a run whose answer is the opaque arm's undefined one as exact when its witness hits natively (INT-69), and the four fragments call the foreign routine after the label (`Snippet.post`: a call before it declines the run `feOpaqueCallUnmodelled`, one after it leaves the tail `ubTailUnverified`), so `routine/importc`, `routine/header`, `routine/nodecl` and `routine/dynlib` are readmitted and exercised through the opaque arm. The own-suite cpp rows `routine/importcpp` and `type/importcpp` are unchanged."
slice = "K8b"
source = "RFC-0016 K8b, the admission-axis suites (INT-56), seed 20261117"
