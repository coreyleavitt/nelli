[[row]]
id = "INT-65"
table = "5.8c"
title = "Found probing INT-63 (K8b's typeop axis suite, INT-56): `nil` of a placeholder sort declines. `var x: pointer = nil; t + 1 == 6 and x == nil` (sat at `a = 5`) returns an untrusted `sxUnknown` with `feUnsupportedExprKind` (\"nil literal of an unmodelled type\"), with or without a `let` copy of `x`, and a closure local compared with `nil` (`f != nil`) declines `ceUnsupportedHof` (\"proc value compared with nil\")"
class = "precision"
state = "closed"
note = "A `pointer` classifies as a placeholder sort (`itUninterp`), which has no representation, so the parser's `nil` arm (`dsl_parser` `nnkNilLit`, ref and ptr only) declines; a closure is the `__closure` placeholder, and its comparison with `nil` is refused at the call-shape layer. Red pin `tests/tsymex_0016_int65_placeholdernil.nim` (unregistered until it is green): the three shapes above. The typeop row `letCursor/uninterp` does not need either (INT-63: a closure local reaches it). Not yet probed: a `pointer` reached by `cast[pointer](addr x)`, and whether a nil handle for a placeholder sort is sound to fabricate (canonicalize's walker-history note says no zero is: `zeroValueForType` declines for `itUninterp`). CLOSED (2026-11-18, walker 434). Native (Nim 2.2.10, c and cpp alike): an uninitialised `pointer` and one set to `nil` are nil; `addr x` and a `cast[pointer]` of a non-nil `ref` are not; one address converted twice is equal and two variables' are not; an uninitialised proc variable is nil and a lambda is not; a call through a nil proc value and a dereference of a nil `ptr` end the process (SIGSEGV). Model: a `pointer` holds the `ptr`/`ref` address it was converted from (`addr`, `pointer(p)`, `cast[pointer](r)`: `nilSideCore`, now also in value position), or its own nil (`pointerNilTy`, the nil of `ptr uint8`; also the zero of an uninitialised `pointer`), and its nil test is lowered as a `ptr`'s; `refEq` compares addresses of different pointee sorts (a ground nil on either side decides it as the other side's nil test; two non-nil ones decline `heUnresolvedRef`, since a `cast` may name one location at two types). A `ptr` cast from a `pointer` declines `heUnsafeCast` (it was a `weInternalWalkerFault` when dereferenced); an integer cast to `pointer` keeps its `feUnsupportedExprKind` decline. A proc value is the routine or closure it was built from, or nil (`nilClosure`, a closure with no site: an uninitialised proc variable, a `nil` stored in one); compared with nil it is `closureEq`'s, a placeholder against a proc value declines `ceUnsupportedHof`, and a call through nil declines `ceUnsupportedHof`. The placeholder sort was not given a nil: `pointer` keeps its `__unsupported` classification (its parameter and field sites still decline). Pinned by `tests/tsymex_0016_int65_ptrnil.nim` (the three reproducer shapes, an uninitialised `pointer`, `addr` and `cast` conversions, a `pointer` formal, equal and distinct addresses, three declines, a closure's and a proc variable's nil, a nil call, the walker-434 floor), which replaces the unregistered `tsymex_0016_int65_placeholdernil.nim`; red at f89fb0c7. Blocks no axis row (the typeop row `letCursor/uninterp` is reached by a closure local, INT-63)."
