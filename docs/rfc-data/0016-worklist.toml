[[row]]
id = "INT-60"
table = "5.8c"
title = "Found by K8b's magic axis suite (INT-56): `len` of an array (magic `LengthArray`, a modelled exact row) declines when its value is an arithmetic operand. `len([int(a), 2]) + int(a) == 6` (sat at `a = 4`) and `let arr = [t, int(b), 1]; arr.len + t == 3` each return an untrusted `sxUnknown`: the compiler magic `len` (`LengthArray`) has no symbolic model (`feUnsupportedOp`). The same `len` in a comparison (`len([int(a), 2]) == 2 and a == 4`) is exact, as is the row's pin (`tsymex_0016_k4a_dispatch` `sLenArr`)."
class = "precision"
state = "closed"
note = "The row's table entry claims exact at every site, but the walker admits `len` of an array only where the parser reaches its comparison arm; an operand position falls through to the unregistered-callee decline. Pinned red by `tests/tsymex_0016_int60_lenarrarith.nim` (a comparison control is green), not registered while red. The axis stream blocks `magic:LengthArray` against this row (`s0016_k8b_snippets.blockedRows`) until it closes. Closed (2026-11-18, walker 417). Root cause: the call-form `len` arm in `dsl_parser` reached a model only for a seq, table or set receiver, so `len` of an array fell through to callee registration and the magic's stub-body decline (`feUnsupportedOp`) wherever it was read. Fix: `len(a)` of an array value folds to its type's element count, beside the `low`/`high` fold; as Nim's code generator (`genArrayLen`, the constant `lengthOrd`), the argument is not evaluated. The axis stream readmits `magic:LengthArray` (magic floor 116 -> 117 of 141, measured on c). Pinned by `tests/tsymex_0016_int60_lenarrarith.nim` (the comparison control, a literal and a `let`-bound array, the version floor)."
