slice = "K8c"
source = "sort U4; S8co item 1; S8cf remainder"
evidence = "**Fixed (2026-11-17, walker 372).** The cause was not in `byteLeafIds`: `checkExact` resolves each `regexRecDefConds` term against the earlier definitions with `Z3_substitute` and held the result raw, with no reference, so Z3 freed it at the next AST-returning call; the roots substituted over it read freed nodes and releasing them crashed at the next `dec_ref` (`byteLeafIds` was the first walk over them). It needs two definitions, the second naming the first: S8cf's `v == f` was `count` over a `replace` value, and the inline term it chose instead hid it. The resolved terms are now owned (`held`), as are `pointCheck`'s lifted values and substitutions (the same raw-hold class), and `count`'s value is a `regexRecDefConds` definition again, so the path is live. RED with the avoidance removed: a false `sxUnsat` on a satisfiable `s.count('a') == 2`, then SIGSEGV in `byteLeafIds`' `=destroy`. Pinned in `tests/tsymex_0016_crh07_substowned.nim`, which is in `scripts/asan-slice.sh`'s core set. **The class (2026-11-17, walker 372).** An audit of every raw handle `src/nelli` stores found more instances, each fixed by owning the term: the symbolic-length `map` built a `Z3FuncDecl` by object construction around the cached closure decl, took no reference, and released the cache's (RED, plain build: `tsymex_0016_crh07_rawholds` hung, killed at 900 s; GREEN: passes); `ensureDistinctSort` referenced `inject` only after the eject decl was made; `iteSV`'s distinct merge held its ite across the base merge; `rawAnyAstOf`'s fallback, `heapLeafRaw`, `elemTermIn` and `tabTermIn` returned the `.raw` of a destroyed temporary (now `keepRaw`, run-owned); `elemValueOf`/`tabValueOf` own their fresh select first; `checkedIte` makes no AST before `Z3_mk_ite`; `ptrTabCellOf` (dead) is gone; `seqCapKinds`, `litHolds`, `mergeMemberships` and the view `removal` key hold owned terms. The guard is `tests/tsymex_0016_crh07_rawhold_census.nim` over `tests/0016-allowlist/rawhold.txt` (228 audited sites, each with its disposition; a `.raw` of a temporary stored or an object-built term is never listable). **ASan proof (2026-11-17, libz3 5.1.0 built under ASan, `--passL:-lstdc++`, mm:orc useMalloc):** `tsymex_0016_crh07_substowned` at 4d3101a8 with the fix reversed: `heap-use-after-free` in `Z3_substitute` (`api_ast.cpp:935`, `expr::get_sort`) called from `runtime::checkExact` (`runtime.nim:11151`) via `checkCapped` and `trySolve`; at 4d3101a8 pristine it is clean (rc 0, 5 checks OK). `tsymex_0016_crh07_rawholds` at 4d3101a8 (the test added, class fix absent): `heap-use-after-free` in `ast::get_kind` under `array_decl_plugin::mk_func_decl` (`array_decl_plugin.cpp:474`) from `Z3_mk_map` (`api_array.cpp:188`) via the `mapArray` decl in `runtime::lowerHofCall` (`runtime.nim:25200`); at 1dbf9658 it is clean (rc 0, 3 checks OK). Without the ASan libz3 the same defects print stale values and exit 0, and the plain-build RED was only a 900 s hang."
