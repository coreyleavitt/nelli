[[row]]
id = "INT-67"
table = "5.8c"
title = "Found by K8b's pragma axis suite (INT-56): a field read through a distinct object that borrows `.` declines. With `type D {.borrow: `.`.} = distinct O`, `D(O(x: t)).x == 5` (sat at `a = 5`) returns an untrusted `sxUnknown` with `feUnsupportedExprKind` (\"`.` on unsupported type distinct D(O{x:i64})\")"
