table = "5.8c"
title = "The finding collector's edges: `droppedSymexFindings` has no production consumer and is per-thread, so a worker thread's drops are invisible; `popEngineFrame` merges speculative nested runs and double-reports; a finding filed mid-statement is not stamped with later stray taint (pre-existing)"
class = "precision (R4-09, R5-07) and soundness (R3-17, not compared against `main`)"
state = "closed"
note = ": fixed (slice `rv0005-lows`, branch `rfc-0016-w4rvlows-d`, walker 413). Part 5 (walker 408->413): a statement's stray taint reaches the findings it filed since it began (`stampStatementSince`), so a hit solved before the stray was found is a candidate, not a clean winner (R3-17; RED: the exit stamp alone left it in `w.found`). No source shape is known to leave stray taint, so the pin drives the stamp through `strayFindingProbe`, as R2's walktaint probe does. Left: `droppedSymexFindings`'s consumer and per-thread scope (R5-07), `popEngineFrame`'s merge of nested runs (R4-09). Part 6 (walker 413 unchanged: no verdict moves): the drop count is one atomic count for the process, so a drop on a thread the property started is counted; a run's `Report.droppedSymexFindings` is how far it moved during the run, and the text, JSON, JUnit and GitHub renderers show it when non-zero (R5-07; cell `report/findings/dropped`; RED: no such field). `popEngineFrame` merges a nested run's findings into the enclosing frame on the claim (`fn` and target), not the call site: one re-found at its own site joins the entry the enclosing frame holds for that claim, keeping the more severe and then the higher `claimRank`; two sites in one run stay two entries (R4-09; cell `report/findings/nested-merge`). Pinned by `tsymex_0016_int36_report`, now registered. Nothing is left"
source = "0005 review R5-07, R6-08, R4-09, R3-17"
cells = ["construct:walk/stmt/stray-findings", "construct:report/findings/dropped", "construct:report/findings/nested-merge"]
pins = ["tsymex_0016_int36_collector", "tsymex_0016_int36_report"]

[[row]]
id = "INT-37"
table = "5.8c"
title = "Precision and unverified probes: `claimStrayPendingTaint` over-taints coalesced pending taint; a possessive quantifier on a non-group item may add 0 to the PCRE size bound (probe near 65536); `symBodyHash` on a bodiless routine (importc or forward declaration) may fail at compile time"
class = "precision; two items unverified"
state = "closed"
note = ": fixed (slice `rv0005-lows`, branch `rfc-0016-w4rvlows-d`, walker 413). R2-09 and R6-09 (part 5): both probes run, neither a defect. PCRE 8.45 has a possessive opcode for every repeat of a character, type, class and back-reference, so a possessive on a non-group item adds nothing; seven families taken to the largest count the reader decides all compile under `re()`, and one more is undecided. A SUT calling an `importc` routine and a forward-declared one compiles and is keyed. R2-08 (part 6): the one raw walk-level `lower` with no drain of its own, `syncAddrCells`'s `mkTableSet`, now drains onto its path, so a stray at a lowering's entry is a walker fault: `claimStrayPendingTaint` stops a debug build on it (RED: `strayClaimProbe` found no stop) and keeps the sound statement-wide fallback in release (cell `walk/stmt/stray-claim`). No suite in the taint and lowering gate tripped the new assertion, so no other stray was found; the probes that queue stray taint on purpose (`stmtExitTaintProbe`, `strayFindingProbe`) set it aside or stamp it directly and never reach the entry check, so no suspension of the assertion exists"
source = "0005 review R2-08, R2-09, R6-09"
cells = ["construct:regex/possessive/size", "construct:cache/key/bodiless", "construct:walk/stmt/stray-claim"]
pins = ["tsymex_0016_int37_probes"]

