[[row]]
id = "INT-62"
table = "5.8c"
title = "Found by K8b's axis suites (INT-56): the solve cost of a program that sums several exact rows' values grows far faster than the rows' own costs. Six type x memory-op rows (`letCursor` over `bool`, `seq`, `set`; `fieldDefault` over `array`, `seq`, `variant`), each exact alone in under 1 s, packed into one accumulator took 359 s on c, and the same program wrapped in a template ran past 550 s (killed). Six type-class rows took 99 s packed; six stdlib rows (no `round`, `floor` or `trunc`) 14-81 s, each alone at most 5.5 s."
class = "performance"
state = "closed"
note = "Each program is the K8b axis shape (`shAxis`: each row's fragment adds an `int` to one accumulator, the target compares it to a literal), seed 20261117 at `per` = 6. Not a hang that the pin settings can bound: the only bound is the wall clock, which they turn off. The axis suites avoid it by running one row per program (`per` = 1, INT-56 item 10), so no suite is red on it and nothing is blocked; it is the cost the packed shape exposed, and a reason the stream cannot pack rows until it closes. Not yet probed: which pairs of rows carry the growth, and whether the query or the walk (path count over the fragments' branches) is where the time goes. Closed (2026-11-18, walker 421). Probed with the six rows packed one at a time (`seq` then `set[char]`): the jump came from two UNSAT overflow sides of about 4M units each once a `set[char]` row's `card` joined a `seq` row (`acc + c1[1] + 2 + card(x2)` leaving the `int` range), and every later query bit-blasted the 256-bit set again (100-200k units each). Root cause: the overflow side is linear arithmetic over the operands' signed Int views, but nothing in the query states their ranges, so Z3 refuted it through the set's bit-blast; and every query that holds a count re-blasts its set. Fix: a query that counts a builtin set's members is asked first, under the small budget of step 0, with each count a fresh variable beside the ranges of the query's `int` views (`cardFreeAbstraction`, `bvViewRangeFacts`: a count over n bits in [0, n], an extension in its narrower range, a non-wrapping sum, difference or `ite` of ranged terms, read through `select(store(..))`). Its models are a superset of the query's, so its UNSAT is the query's own; each range is a theorem. `tests/tsymex_0016_int62_packcost.nim`: (1) every range kind valid, a 32-bit extension's bounds past a C int; (1b) the abstraction drops the set and refutes the side in under 20k units; (2) no range for an input, a product, a full-width extension or a sum that may wrap; (3) the six rows packed walk in 827,151 units against a rows' sum of 128,614 (6.4 times; bound 10 times; past 16.5M before); (4) the floor. The axis suites still run one row per program (`per` = 1); packing them again is a change to the axis stream's figures, not to this cost."
