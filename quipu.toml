# quipu v1 (tool source: ~/projects/quipu; hub instance: quipu.leavitt.dev).
# The documents themselves are the ledgers (+++ TOML front matter); handoffs
# and companions carry no fence and are not documents.

# The display name on the hub. Declared, because the fallback is this
# directory's own basename -- `proptest` -- and since the RFC 0005 cutover
# the hub shows whatever title the ingest payload carried.
title = "nelli"

[record]
globs = ["docs/rfc/*.md"]

# RFC 0004 fork debt-cap, proceeding on its recorded lean (K=3, per-repo);
# the fork stays open for ratification.
[roadmap]
review_cap = 3

# This repository's slug on the hub (quipu.leavitt.dev). Where this clone
# sends its ingest payload and what authorizes it are facts about the clone,
# kept beside its git dir by `quipu hub join` (`quipu-hub`, `quipu-token`),
# never in a tracked file.
[hub]
slug = "nelli"
