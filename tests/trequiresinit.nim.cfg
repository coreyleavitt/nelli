# Escalate the three warnings that fire when nelli default-constructs a
# user's element type. Binding a `{.requiresInit.}` type must stay clean, so
# any reintroduced `default(T)` / `var x: T` / zero-filling `newSeq[T]` in the
# engine becomes a hard *compile error* here rather than a silent warning that
# only bites consumers on strict-def Nim builds. (See REQUIRESINIT_DSL_FRICTION.md.)
--warningAsError:UnsafeDefault:on
--warningAsError:UnsafeSetLen:on
--warningAsError:ProveInit:on
