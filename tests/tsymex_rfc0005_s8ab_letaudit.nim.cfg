# RFC-0005 S8ak: turn on symex.nim's and concolic.nim's own build-time
# self-audit blocks (`when defined(nelliVmAliasAudit):`) for THIS suite's
# compile, on Linux too -- not only on the three Windows legs, which set
# this define for this one suite via `run-ci-suite.ps1 -ExtraNimArgs`
# (see `.github/workflows/symex-mingw.yaml` and the sibling fuzzer-*
# workflows). Without this, the define was never on anywhere the Linux
# sweep runs, so `genericRoutineSpecs`' line-keying regression (S8ad
# shifted `traceOneCallBoundary` from `dsl_parser.nim:7269` to `:7270`,
# desyncing the reachable-generic hit key from the forced-instantiation
# key) went red on all three Windows legs and was invisible to Linux CI
# entirely. Nim auto-reads `<testfile>.nim.cfg`, so this define is active
# under the standard `scripts/dt.sh`/`scripts/dt-bounded.sh` harness (and
# therefore `scripts/sweep.sh`) with no other change, on both backends,
# and is compiled OUT of every other test -- no other file's `.nim.cfg`
# sets it, and this suite is the only one that imports `nelli/symex` and
# `nelli/concolic` with `{.all.}}` AND wants their self-audit blocks live.
-d:nelliVmAliasAudit
