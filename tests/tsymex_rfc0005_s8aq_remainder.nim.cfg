# RFC-0005 S8aq: enables nim-z3's `replaceAll` (`Z3_mk_seq_replace_all`,
# absent below Z3 4.16) for THIS suite's compile, so `iekStrReplaceAll`
# (`runtime_strings.nim`) takes the real op instead of always declining with
# `SymexZ3VersionMissingError`. nim-z3 already ships the FFI binding and its
# own `Available()` runtime guard -- no nim-z3 change needed, only turning
# the flag on. Nim auto-reads `<testfile>.nim.cfg`, so this define is active
# under `scripts/dt.sh`/`scripts/dt-bounded.sh`/the nimble test task with no
# extra flag, exactly like `symexQueryStats`/`nelliVmAliasAudit` above. No
# other test file sets this, so `str.replace_all` stays unreachable
# everywhere else -- unchanged default public surface, same precedent nim-z3
# itself documents for the flag.
-d:z3WithSeqReplaceAll
