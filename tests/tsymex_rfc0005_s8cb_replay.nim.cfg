# The foreign-thread case (a raw pthread_create, section 6 of the test) needs
# Nim's allocator out of the way: Nim sets nothing up for a thread it did not
# create, and nim-z3 (1320c2e, THREADING.md) found its own allocator crashing
# in rawAlloc on such a thread, with or without a fix. `-d:useMalloc` hands
# allocation to the C library, which is thread-safe on any thread.
@if linux:
  define:useMalloc
@end
